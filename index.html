<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Familienzentrale</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}*{-webkit-touch-callout:none}</style>
<style>
/* Startseite: oben das Jetzt (Uhr, Wetter, Zeitstrahl), darunter Karten in voller Breite.
   Wand-iPad im Hochformat: alles auf einem Bildschirm. Handy: normal scrollen. */
*, *::before, *::after { box-sizing: border-box; }
body { font: 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; }
.app { max-width: 880px; margin: 0 auto; padding: 10px max(18px, env(safe-area-inset-left, 0px)) 18px max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.emo { font-family: var(--font-emoji); }
.topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; min-height: 30px; }
.gear { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--muted); }
.gear svg, .ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.date { font-weight: 700; font-size: 20px; color: var(--muted); }
.clock { font: 800 clamp(64px, 16vw, 132px)/.9 var(--font-display); letter-spacing: -.045em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.wx { display: flex; align-items: center; gap: 12px; text-align: right; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; padding: 8px; border-radius: 20px; }
.wx:hover { background: rgba(127,127,127,.08); }
.wx svg { width: clamp(52px, 12vw, 96px); height: clamp(52px, 12vw, 96px); flex: none; }
.wx .t { font: 800 clamp(36px, 9vw, 72px)/1 var(--font-display); letter-spacing: -.03em; }
.wx .s { color: var(--muted); font-weight: 600; font-size: clamp(13px, 2.4vw, 18px); }
.wx .tap { display: block; font-size: 13px; font-weight: 800; color: var(--accent); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 99px; padding: 7px 14px; font-weight: 700; font-size: 16px; white-space: nowrap; }
.chip.ph { color: #fff; }
.chip.warn { background: transparent; border: 1.5px solid var(--warn); color: var(--warn); white-space: normal; }
.card { background: var(--surface); border-radius: var(--r); padding: 18px 20px; min-width: 0; color: inherit; text-decoration: none; display: block; }
.card.t1 { background: var(--t-essen); } .card.t2 { background: var(--t-haus); } .card.t3 { background: var(--t-termin); }
.lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(15,19,23,.66); margin-bottom: 10px; }
.lbl em { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.meal { display: flex; align-items: center; gap: 14px; }
.meal .e { font-family: var(--font-emoji); font-size: 58px; line-height: 1; flex: none; }
.meal .img { width: 76px; height: 76px; border-radius: 16px; overflow: hidden; flex: none; }
.meal .img img { width: 100%; height: 100%; object-fit: cover; }
.meal h3 { margin: 0; font: 800 24px/1.12 var(--font-display); overflow-wrap: anywhere; }
.meal p { margin: 4px 0 0; font-size: 14px; color: rgba(15,19,23,.66); font-weight: 600; }
.next { margin: 10px 0 0; font-size: 14px; font-weight: 600; color: rgba(15,19,23,.7); }
.li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(15,19,23,.1); min-width: 0; }
.lbl + .li, .li:first-child { border-top: 0; }
.li .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.li .tm { flex: none; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 52px; }
.pbar { flex: none; width: 5px; align-self: stretch; border-radius: 4px; background: var(--pc, var(--fam)); }
.empty { margin: 0; color: rgba(15,19,23,.6); font-weight: 600; }
.hh { display: flex; flex-direction: column; min-height: 0; }
.task { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(15,19,23,.1); min-width: 0; }
.lbl + .task, #hhl .task:first-child { border-top: 0; }
.task .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.task .t b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .m { font-size: 13px; font-weight: 700; color: rgba(15,19,23,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .m .late { color: var(--warn); }
.task.fin .t b { text-decoration: line-through; color: rgba(15,19,23,.55); }
.task .ok { flex: none; font-weight: 800; color: #0d6b4b; font-size: 14px; }
.who { flex: none; display: flex; gap: 8px; }
.who button { border: 0; width: 52px; height: 52px; border-radius: 50%; color: #fff; font: 800 18px var(--font); cursor: pointer; }
.chk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid rgba(15,19,23,.45); background: transparent; cursor: pointer; }
.more { font-size: 14px; font-weight: 700; color: rgba(15,19,23,.6); padding-top: 6px; }
.rate .rr { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.rate .nm { flex: 1; font-weight: 800; }
.faces { display: flex; gap: 6px; }
.faces button { border: 2px solid var(--line); background: var(--bg); border-radius: 14px; font-family: var(--font-emoji); font-size: 28px; width: 56px; height: 50px; cursor: pointer; padding: 0; line-height: 1; }
.faces button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.faces button.dim { opacity: .35; filter: grayscale(1); }
.faces button.nd { font: 800 11px/1.05 var(--font); color: var(--muted); width: auto; min-width: 46px; padding: 0 6px; }
.hint { display: flex; align-items: center; gap: 12px; background: var(--soft); }
.hint b { display: block; }
.hint small { color: var(--muted); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: var(--t-stat); }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats b { font: 800 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; font-weight: 700; color: rgba(15,19,23,.62); }
#fz-status { font-size: 13px; color: var(--muted); }
/* Wand-iPad hoch: ein Bildschirm, Haushalt nimmt den Rest */
@media (min-width: 700px) and (orientation: portrait) {
  body.wand .app { height: calc(100dvh - 96px - env(safe-area-inset-bottom, 0px)); overflow: hidden; padding-top: 18px; gap: 18px; }
  body.wand .hh { flex: 1; overflow: hidden; }
  .card { padding: 20px 22px; }
  .rate .rows { display: flex; gap: 14px; }
  .rate .rr { flex: 1; flex-direction: column; align-items: flex-start; gap: 8px; padding: 0; }
}
@media (max-width: 560px) {
  .grid2 { grid-template-columns: 1fr; gap: 12px; }
  .app { gap: 12px; }
  .chip { font-size: 13px; padding: 5px 10px; }
  .faces button { width: 44px; height: 42px; font-size: 22px; border-radius: 12px; }
  .meal .e { font-size: 46px; }
  .meal h3 { font-size: 21px; }
}
</style>
</head>

<div class="app">
  <div class="topbar"><span id="fz-status"></span><a class="gear" href="eltern/" aria-label="Eltern-Seite"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a></div>
  <header class="head" id="head"></header>
  <div id="main" aria-live="polite" style="display:contents"></div>
</div>
<script src="core.js?v=20261113h"></script>
<script src="wetter.js?v=20261113h"></script>
<script>(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const { esc, pad, iso, parse, addDays } = FZ;
  const WD = FZ.WD;
  const WD_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const N = FZ.NAMEN;
  const RATERS = ["chris", "lisa", "ruby"];
  const SMILE = { 3: "😋", 2: "🙂", 1: "😕" }, SMILE_TXT = { 3: "lecker", 2: "okay", 1: "nicht so" };
  const PC = { chris: "var(--chris)", lisa: "var(--lisa)", offen: "var(--p-offen)" };
  const fmt = (min) => pad(Math.floor(min / 60)) + ":" + pad(min % 60);
  if (FZ.wand) document.body.classList.add("wand");

  // Termine: Personenfarbe aus Name im Titel, sonst Familie
  const farbe = (t) => FZ.PERS_FARBE[FZ.terminPerson(t)];
  function eventsFrom(date, days) {
    const end = addDays(date, days);
    return FZ.termine.filter((t) => t.datum < end && (t.bis || t.datum) >= date)
      .map((t) => Object.assign({}, t, { datum: t.datum < date ? date : t.datum }))
      .sort((a, b) => (a.datum + (a.zeit || "00:00")).localeCompare(b.datum + (b.zeit || "00:00")));
  }
  // Wert 1–3 oder „nicht dabei“ (zählt als beantwortet, geht aber nicht in die Statistik ein)
  const ND = "nicht dabei";
  const rating = (d, p) => { const b = FZ.reiter("Bewertungen").find((x) => x.Datum === d && x.Person === p); return !b ? null : b.Wert === ND ? ND : Number(b.Wert) || null; };
  const vis = (m) => (m.bild ? '<span class="img"><img src="' + esc(m.bild) + '" alt=""></span>' : '<span class="e" aria-hidden="true">' + esc(m.emoji) + "</span>");
  const kat = (g) => String(g || "").split(",").map((x) => x.trim()).filter(Boolean).slice(0, 2).join(" · ");

  function render() {
    const now = new Date(), date = iso(now), min = now.getHours() * 60 + now.getMinutes();
    const Pl = FZ.phasen(date), ph = FZ.phaseAt(min, Pl);
    document.documentElement.dataset.phase = ph.id;
    if (FZ.gate($("#main"))) { $("#head").hidden = true; return; }
    const d = parse(date), info = FZ.dayInfo(date), E = FZ.einst();
    const W = FZ.wetter && FZ.wetter.daten;

    // Kopf
    $("#head").hidden = false;
    $("#head").innerHTML = '<div><div class="date">' + WD_LONG[d.getDay()] + ", " + d.getDate() + ". " + d.toLocaleDateString("de-DE", { month: "long" }) + '</div><div class="clock">' + fmt(min) + "</div></div>" +
      (W ? '<button type="button" class="wx" id="wx" aria-label="Wetter und Regenradar öffnen"><div><div class="t">' + FZ.wetter.zahl(W.jetzt.t) + '°</div><div class="s">' + FZ.wetter.zahl(W.tage[0].max) + "° / " + FZ.wetter.zahl(W.tage[0].min) + "°<br>" + esc(W.regen) + '</div><span class="tap">Radar und Details ›</span></div>' + FZ.wetter.icon(W.jetzt.art) + "</button>"
        : '<div class="wx"><div class="s">Wetter lädt …</div></div>');

    // Chips: Phase, Kita, Warnung, Kinder
    const kids = FZ.kinderAufgaben(date, ph.id), kitaJetzt = info.kita && !FZ.kitaVorbei(date, min);
    const kidsDone = kids.filter((k) => k["Erledigt am"] === date).length;
    const warn = W && W.warnungen && W.warnungen[0];
    let h = '<div class="chips"><span class="chip ph" style="background:' + ph.farbe + '"><span class="emo">' + esc(ph.symbol) + "</span>" + esc(ph.name) + (ph.id !== "nacht" ? " bis " + ph.ende : "") + "</span>" +
      '<span class="chip">' + (kitaJetzt ? "🎒 " : "🏠 ") + esc(FZ.tagText(info, !kitaJetzt)) + "</span>" +
      (kids.length ? '<span class="chip">⭐ Kinder ' + kidsDone + "/" + kids.length + "</span>" : "") +
      (warn ? '<span class="chip warn">⚠ ' + esc(warn.titel.replace(/^Amtliche WARNUNG vor /i, "Warnung: ")) + "</span>" : "") + "</div>";
    h += FZ.zeitstrahl(!FZ.wand && innerWidth < 560);

    // Wie war's gestern?
    const bis = /^\d{1,2}:\d{2}$/.test(E.essen_bewertung_bis || "") ? FZ.toMin(E.essen_bewertung_bis) : 17 * 60;
    const y = addDays(date, -1), gm = FZ.meal(y);
    if (min < bis && gm && gm.status === "gericht" && !RATERS.every((p) => rating(y, p))) {
      h += '<section class="card rate"><div class="lbl">Gestern: ' + esc(gm.name) + "<em>Wie war's?</em></div><div class='rows'>" + RATERS.map((p) => {
        const cur = rating(y, p);
        return '<div class="rr"><span class="nm">' + N[p] + '</span><span class="faces">' + [3, 2, 1, ND].map((v) => '<button type="button" class="' + (v === ND ? "nd " : "") + (cur && cur !== v ? "dim" : "") + '" data-rate="' + v + '" data-p="' + p + '" data-d="' + y + '" data-g="' + esc(gm.id) + '" aria-pressed="' + (cur === v) + '" aria-label="' + N[p] + ": " + (v === ND ? "nicht mitgegessen" : SMILE_TXT[v]) + '">' + (v === ND ? "nicht<br>dabei" : SMILE[v]) + "</button>").join("") + "</span></div>";
      }).join("") + "</div></section>";
    }
    // Essen planen (Mittwoch ab essen_hinweis)
    const hw = String(E.essen_hinweis || "mi 17:00").trim().split(/\s+/);
    const hTag = WD.indexOf((hw[0] || "mi").toLowerCase()), hMin = /^\d{1,2}:\d{2}$/.test(hw[1] || "") ? FZ.toMin(hw[1]) : 17 * 60;
    if (d.getDay() === hTag && min >= hMin) { let open = 0; for (let i = 1; i <= 7; i++) if (!FZ.meal(addDays(date, i))) open++; if (open) h += '<a class="card hint" href="essen/"><span class="emo" style="font-size:28px">🗓️</span><span><b>Essen für nächste Woche planen</b><small>' + open + (open === 1 ? " Abend ist" : " Abende sind") + " ab morgen noch offen</small></span></a>"; }

    // Essen und Termine
    const meal = FZ.meal(date), tm = FZ.meal(addDays(date, 1));
    const gegessen = meal && meal.status === "gericht" && FZ.abendessenFertig(date);
    const mealCard = '<a class="card t1" href="essen/"><div class="lbl">' + (gegessen ? "Heute gab es" : "Heute Abend") + "</div>" + (meal ? '<div class="meal">' + vis(meal) + "<div><h3>" + esc(meal.status === "gericht" ? meal.name : meal.kid) + "</h3>" + (meal.kategorie ? "<p>" + esc(kat(meal.kategorie)) + "</p>" : "") + "</div></div>" : '<p class="empty">Noch nichts geplant</p>') + (tm ? '<p class="next">Morgen: <b>' + esc(tm.name) + "</b></p>" : "") + "</a>";
    const nowHM = fmt(min);
    const evs = eventsFrom(date, 2).filter((t) => !(t.datum === date && t.zeit && (t.ende || t.zeit) < nowHM));
    const heute = evs.filter((t) => t.datum === date), morgen = evs.filter((t) => t.datum !== date).slice(0, 2);
    const evCard = '<a class="card t3" href="kalender/"><div class="lbl">Termine heute<em>' + heute.length + "</em></div>" +
      (heute.length ? heute.slice(0, 4).map((t) => '<div class="li"><span class="pbar" style="--pc:' + farbe(t) + '"></span><span class="tm">' + esc(t.zeit || "ganzt.") + '</span><span class="tx">' + esc(t.titel) + "</span></div>").join("") : '<p class="empty">Heute keine Termine</p>') +
      morgen.map((t) => '<div class="li"><span class="pbar" style="--pc:' + farbe(t) + '"></span><span class="tm">Morgen</span><span class="tx">' + esc((t.zeit ? t.zeit + " " : "") + t.titel) + "</span></div>").join("") + "</a>";
    h += '<div class="grid2">' + mealCard + evCard + "</div>";

    // Tagesstimmung ab Beginn der Abendphase
    if (ph.id === "abend" || (ph.id === "nacht" && min >= 12 * 60)) {
      const leute = FZ.wand ? ["chris", "lisa"] : FZ.person ? [FZ.person] : ["chris", "lisa"];
      h += '<section class="card rate"><div class="lbl">Wie war ' + (leute.length === 1 ? "dein" : "euer") + " Tag?<em>Tagesstimmung</em></div><div class='rows'>" + leute.map((p) => {
        const cur = FZ.stimmung(date, p);
        return '<div class="rr"><span class="nm">' + N[p] + '</span><span class="faces">' + [1, 2, 3, 4, 5].map((v) => '<button type="button" class="' + (cur && cur !== v ? "dim" : "") + '" data-mood="' + v + '" data-p="' + p + '" aria-pressed="' + (cur === v) + '" aria-label="' + N[p] + ": " + FZ.MOOD_TXT[v] + '">' + FZ.MOOD[v] + "</button>").join("") + "</span></div>";
      }).join("") + "</div></section>";
    }

    // Haushalt heute
    let tasks = FZ.hhHeute(date);
    const mine = !FZ.wand && FZ.person;
    if (mine) tasks = tasks.filter((t) => t.zust === FZ.person || t.zust === "offen");
    const offen = tasks.filter((t) => !t.fertig);
    const fertig = tasks.length - offen.length;
    h += '<section class="card t2 hh"><div class="lbl">' + (mine ? "Deine Aufgaben" : "Haushalt heute") + "<em>" + (offen.length ? offen.length + " offen" : "alles erledigt") + (fertig ? " · " + fertig + " fertig" : "") + '</em></div><div id="hhl">' +
      (offen.length ? offen.map((t) => {
        const meta = (t.zust === "offen" ? "für alle" : N[t.zust]) + " · " + t.punkte + (t.punkte === 1 ? " Punkt" : " Punkte") + (t.spaet ? ' · <span class="late">seit ' + t.spaet + (t.spaet === 1 ? " Tag" : " Tagen") + " fällig</span>" : "") + (t.max > 1 ? " · höchstens " + t.max + "× am Tag" : "");
        const dots = t.max > 1 ? FZ.punkteHtml(t.von, t.max) : "";
        const act = FZ.wand || !FZ.person
          ? '<span class="who">' + ["chris", "lisa"].filter((p) => t.zust === "offen" || t.zust === p).map((p) => '<button type="button" data-hh="' + esc(t.id) + '" data-p="' + p + '" style="background:' + PC[p] + '" aria-label="' + esc(t.titel) + " erledigt von " + N[p] + '">' + N[p][0] + "</button>").join("") + "</span>"
          : '<button type="button" class="chk" data-hh="' + esc(t.id) + '" data-p="' + FZ.person + '" aria-label="' + esc(t.titel) + ' erledigt"></button>';
        return '<div class="task"><div class="t"><b>' + esc(t.titel) + '</b><span class="m">' + meta + "</span></div>" + dots + act + "</div>";
      }).join("") : '<p class="empty">Heute ist alles geschafft. 🎉</p>') + "</div></section>";

    // Diese Woche (tagsüber auf dem Handy und nachmittags an der Wand)
    if (!FZ.wand || (min >= bis && ph.id !== "abend" && ph.id !== "nacht")) h += wocheKarte(date);

    $("#main").innerHTML = h;
    fit();
    if (FZ.wetter && FZ.wetter.daten) FZ.wetter.hintergrund();
  }
  function wocheKarte(date) {
    const ab = addDays(date, -6);
    const er = FZ.reiter("Erledigt").filter((e) => { const t = String(e.Zeitpunkt || "").slice(0, 10); return t >= ab && t <= date && e.Art !== "ausgesetzt"; }).length;
    const bw = FZ.reiter("Bewertungen").filter((b) => !FZ.istStimmung(b) && b.Datum >= addDays(date, -27)).map((b) => Number(b.Wert)).filter(Boolean);
    const st = FZ.stimmungListe().filter((b) => b.Datum >= addDays(date, -27)).map((b) => Number(b.Wert)).filter(Boolean);
    const avg = (a) => (a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(1).replace(".", ",") : "–");
    return '<a class="card stats" href="statistik/"><div><b>' + er + "</b><span>Aufgaben in 7 Tagen</span></div><div><b>" + avg(bw) + "</b><span>Essen Ø von 3</span></div><div><b>" + avg(st) + "</b><span>Stimmung Ø von 5</span></div></a>";
  }
  // Wand: Haushaltsliste kürzen, damit alles auf einen Bildschirm passt
  function fit() {
    if (!FZ.wand) return;
    const box = $("#hhl"), card = box && box.parentElement; if (!box) return;
    let n = 0;
    while (card.scrollHeight > card.clientHeight + 1 && box.querySelectorAll(".task").length > 1) {
      const all = box.querySelectorAll(".task"); all[all.length - 1].remove(); n++;
    }
    if (n) { const m = document.createElement("div"); m.className = "more"; m.textContent = "+ " + n + (n === 1 ? " weitere Aufgabe" : " weitere Aufgaben") + " im Haushalt"; box.appendChild(m); while (card.scrollHeight > card.clientHeight + 1 && box.querySelectorAll(".task").length > 1) { const all = box.querySelectorAll(".task"); all[all.length - 1].remove(); n++; m.textContent = "+ " + n + " weitere Aufgaben im Haushalt"; } }
  }

  function rate(d, p, v, g) {
    const rows = FZ.daten.Bewertungen || (FZ.daten.Bewertungen = []);
    const i = rows.findIndex((b) => b.Datum === d && b.Person === p);
    if (i >= 0 && rows[i].Wert === v) { rows.splice(i, 1); FZ.send([{ art: "loeschen", reiter: "Bewertungen", wo: { Datum: d, Person: p } }]); }
    else { if (i >= 0) { rows[i].Wert = String(v); rows[i]["Gericht-ID"] = g; } else rows.push({ Datum: d, "Gericht-ID": g, Person: p, Wert: String(v) }); FZ.send([{ art: "setzen", reiter: "Bewertungen", wo: { Datum: d, Person: p }, werte: { "Gericht-ID": g, Wert: String(v) } }]); }
    render();
  }
  document.addEventListener("click", (ev) => {
    const r = ev.target.closest("[data-rate]"); if (r) return rate(r.dataset.d, r.dataset.p, r.dataset.rate, r.dataset.g);
    const m = ev.target.closest("[data-mood]"); if (m) return FZ.stimmungSetzen(iso(new Date()), m.dataset.p, Number(m.dataset.mood));
    const t = ev.target.closest("[data-hh]"); if (t) return FZ.hhErledigen(t.dataset.hh, t.dataset.p);
    if (ev.target.closest("#wx") && FZ.wetter) FZ.wetter.ansicht();
  });

  FZ.on(render);
  FZ.wetter.on(render);
  window.addEventListener("resize", render);
  FZ.nav("start");
  FZ.start();
  render();
  setInterval(render, 20000);
})();
</script>
</body>
</html>
