<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familie">
<title>Kinder · Familienzentrale</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}*{-webkit-touch-callout:none}</style>
<style>
:root {
  /* Layout: Kopf (Jetzt-Phase groß links, Uhr/Datum/Kita-Chip rechts) · Tagesleiste 6–21 Uhr mit Markierung · große Emoji-Karten, Spaltenzahl nach Anzahl · Vorschau-Leiste (nur Entwurf) */
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --line: #DEE1DB;
  --fg: #1B1F1C;
  --muted: #5F6761;
  --ink: #1B1F1C;
  --on-ink: #FFFFFF;
  --a-morgen: #C8662A;  --s-morgen: #FBE8D9;
  --a-tag: #2A6FB0;     --s-tag: #E0ECF8;
  --a-leise: #6D669C;   --s-leise: #E6E3F2;
  --a-abend: #C98B3E;   --s-abend: #F6E9D6;
  --seg-off: #E7E9E4;
  --accent: var(--a-tag);
  --soft: var(--s-tag);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --r: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1B1F1C; --line: #323833; --fg: #E7EBE6; --muted: #9AA39C; --ink: #E7EBE6; --on-ink: #141715;
    --a-morgen: #F0A06A; --s-morgen: #3A2717;
    --a-tag: #86B4E8;    --s-tag: #1B2A3B;
    --a-leise: #ABA4D8;  --s-leise: #26233A;
    --a-abend: #E2B06C;  --s-abend: #33271A;
    --seg-off: #262B27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1B1F1C; --line: #323833; --fg: #E7EBE6; --muted: #9AA39C; --ink: #E7EBE6; --on-ink: #141715;
  --a-morgen: #F0A06A; --s-morgen: #3A2717;
  --a-tag: #86B4E8;    --s-tag: #1B2A3B;
  --a-leise: #ABA4D8;  --s-leise: #26233A;
  --a-abend: #E2B06C;  --s-abend: #33271A;
  --seg-off: #262B27;
  color-scheme: dark;
}

/* Phase bestimmt die Akzentfarbe */
:root[data-phase="morgen"] { --accent: var(--a-morgen); --soft: var(--s-morgen); }
:root[data-phase="tag"] { --accent: var(--a-tag); --soft: var(--s-tag); }
:root[data-phase="leisezeit"] { --accent: var(--a-leise); --soft: var(--s-leise); }
:root[data-phase="abend"], :root[data-phase="nacht"] { --accent: var(--a-abend); --soft: var(--s-abend); }

/* Anzeigemodus Leisezeit: ruhig, weich, leicht gedimmt */
:root[data-mode="leise"] {
  --bg: #E7E6EC; --surface: #F1F0F5; --line: #D6D4DF; --fg: #34323F; --muted: #6C6A7A; --ink: #34323F; --on-ink: #F1F0F5;
  --accent: #6D669C; --soft: #E0DDEC; --seg-off: #DCDAE4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-mode="leise"] {
    --bg: #141319; --surface: #1C1B23; --line: #2C2A36; --fg: #C9C5D6; --muted: #8A8699; --ink: #C9C5D6; --on-ink: #141319;
    --accent: #9E97C9; --soft: #25233A; --seg-off: #23222C;
  }
}
:root[data-theme="dark"][data-mode="leise"] {
  --bg: #141319; --surface: #1C1B23; --line: #2C2A36; --fg: #C9C5D6; --muted: #8A8699; --ink: #C9C5D6; --on-ink: #141319;
  --accent: #9E97C9; --soft: #25233A; --seg-off: #23222C;
}
/* Abendmodus: warm, stark abgedunkelt (gleich in beiden Themes) */
:root[data-mode="abend"] {
  --bg: #17120D; --surface: #211A13; --line: #33281D; --fg: #E6D5BF; --muted: #A28D74; --ink: #E6D5BF; --on-ink: #17120D;
  --accent: #D9A15A; --soft: #2E2318; --seg-off: #281F17;
  color-scheme: dark;
}
/* Nachtmodus: fast schwarz */
:root[data-mode="nacht"] {
  --bg: #050505; --surface: #0E0D0C; --line: #1B1916; --fg: #6E665D; --muted: #4E4943; --ink: #6E665D; --on-ink: #050505;
  --accent: #7A6A55; --soft: #141210; --seg-off: #121110;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 17px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; transition: background-color .6s ease, color .6s ease; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
h1, h2 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.emo { font-family: var(--font-emoji); line-height: 1; }

.app {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 28px;
  display: grid; gap: 24px;
}

/* Kopf */
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 28px; align-items: end; }
.now { display: grid; gap: 4px; min-width: 0; }
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.now h1 { display: flex; align-items: center; gap: 16px; font: 800 64px/1.02 var(--font-display); letter-spacing: -.02em; color: var(--fg); }
.now h1 .emo { font-size: 58px; }
.now .sub { font-size: 21px; color: var(--muted); }
.now .sub b { color: var(--fg); font-weight: 650; }
.side { display: grid; justify-items: end; gap: 6px; text-align: right; }
.clock { font: 700 46px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.date { font-size: 18px; color: var(--muted); }
.daychip { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 8px 16px 8px 12px; border-radius: 999px; background: var(--soft); color: var(--fg); font-weight: 650; font-size: 18px; }
.daychip .emo { font-size: 24px; }
.daychip small { font-weight: 500; color: var(--muted); font-size: 16px; }
@media (max-width: 700px) {
  .head { grid-template-columns: 1fr; }
  .side { justify-items: start; text-align: left; grid-template-columns: auto auto; align-items: baseline; column-gap: 12px; }
  .daychip { grid-column: 1 / -1; justify-self: start; }
  .now h1 { font-size: 44px; } .now h1 .emo { font-size: 40px; }
  .clock { font-size: 34px; }
  .now .sub { font-size: 18px; }
}

/* Tagesleiste */
.daybar { display: grid; gap: 6px; }
.track { position: relative; display: flex; gap: 4px; height: 52px; }
.seg { flex: var(--w) 1 0; min-width: 0; border-radius: 14px; background: var(--seg-off); display: grid; place-items: center; font-size: 26px; opacity: .55; transition: opacity .4s, background-color .4s; }
.seg.on { background: var(--soft); opacity: 1; box-shadow: inset 0 0 0 3px var(--accent); }
.seg.past { opacity: .35; }
.marker { position: absolute; top: -8px; bottom: -8px; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); transition: left .6s ease; }
.ticks { position: relative; height: 18px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
@media (max-width: 560px) { .ticks span.mid { display: none; } .seg { font-size: 20px; } .track { height: 44px; } }

/* Karten: bis zu 3 Aufgaben in einer Reihe, rechts daneben die Infokarten (Anziehen, Abendessen) */
.cards { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 270px)); justify-content: center; align-items: start; gap: 22px; }
.cards.only-info { grid-template-columns: minmax(0, 560px); }
@media (max-width: 640px) {
  .cards, .cards.only-info { grid-template-columns: repeat(var(--mcols, 2), minmax(0, 1fr)); gap: 14px; }
}

/* Fortschritt: ein Stern pro Aufgabe */
.progress { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 16px; min-height: 44px; }
.stars { display: flex; gap: 8px; }
.star { width: 40px; height: 40px; display: grid; place-items: center; font-size: 32px; line-height: 1; }
.star.off::before { content: ""; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--muted); opacity: .45; }
.star.pop { animation: starpop .7s cubic-bezier(.3, 1.9, .5, 1) both; }
.progress .ptxt { font: 700 21px/1 var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .ptxt b { color: var(--fg); }
@keyframes starpop { 0% { transform: scale(.2) rotate(-40deg); } 100% { transform: none; } }

/* Infokarten: keine Aufgaben, deshalb mit Rahmen und rundem Bild statt Kachel und Haken.
   Grundform (Handy, Hochformat): unter den Aufgaben, Bild links, Text rechts. */
.info { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 14px; min-width: 0; align-items: stretch; }
.icard { border: 2px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 14px; row-gap: 8px; text-align: left; color: var(--fg); min-width: 0; }
.plate { width: 76px; aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--soft); display: grid; place-items: center; overflow: hidden; flex: none; container-type: inline-size; }
.plate .emo { font-size: 42px; white-space: nowrap; }
.plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
@supports (font-size: 1cqw) {
  .plate .emo { font-size: 56cqw; }
  .plate .emo.two { font-size: 34cqw; }
  .plate .emo.many { font-size: 25cqw; }
}
.itxt { display: grid; gap: 3px; min-width: 0; }
.icard .lbl { font: 700 13.5px/1.2 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.icard .ttl { font: 700 19px/1.15 var(--font-display); letter-spacing: -.01em; overflow-wrap: break-word; }
.icard .mm { color: var(--muted); font: 500 14.5px/1.25 var(--font); }
.icard .mm b { color: var(--fg); font-weight: 650; }
/* Anziehen: die Kleidungsstücke groß in einer Reihe, Text darunter */
.icard.kleid { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
.wear { display: flex; gap: 4px; padding: 8px 18px; border-radius: 999px; background: var(--soft); font-size: 42px; line-height: 1; white-space: nowrap; }
@media (max-width: 640px) {
  .wear { font-size: 36px; }
  .star { width: 32px; height: 32px; font-size: 26px; }
  .progress .ptxt { font-size: 18px; }
}
.card { position: relative; background: var(--surface); border: 0; border-radius: var(--r); padding: 14px 14px 20px; display: grid; grid-template-rows: auto 1fr; gap: 14px; justify-items: center; align-content: start; text-align: center; box-shadow: 0 1px 0 var(--line); color: var(--fg); width: 100%; }
button.card { cursor: pointer; touch-action: manipulation; }
.tile { width: 100%; aspect-ratio: 5 / 4; max-width: 100%; border-radius: 20px; background: var(--soft); display: grid; place-items: center; overflow: hidden; container-type: inline-size; }
.tile .emo { font-size: clamp(40px, 9vw, 112px); white-space: nowrap; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
@supports (font-size: 1cqw) {
  .tile .emo { font-size: min(52cqw, 120px); }
  .tile .emo.two { font-size: min(32cqw, 80px); }
  .tile .emo.many { font-size: min(22cqw, 56px); }
}
.card .ttl { display: grid; align-content: center; gap: 2px; font: 700 28px/1.15 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; padding-inline: 4px; }
.card .ttl small { font: 600 17px/1.2 var(--font); letter-spacing: 0; color: var(--muted); }
.card .mm { color: var(--muted); font: 500 16px/1.25 var(--font); letter-spacing: 0; margin-top: 6px; }
.card .mm b { color: var(--fg); font-weight: 650; }
@media (max-width: 640px) { .card .ttl { font-size: 21px; } .card .ttl small { font-size: 14px; } .card { padding: 10px 10px 14px; gap: 10px; border-radius: 22px; } }
.note { justify-self: center; color: var(--muted); font-size: 18px; text-align: center; }
.note b { color: var(--fg); font-weight: 650; }

/* Abhaken */
.chk { position: absolute; top: 24px; right: 24px; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--accent); background: var(--surface); display: grid; place-items: center; opacity: .9; }
.chk svg { width: 28px; height: 28px; fill: none; stroke: var(--on-ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.card.done .chk { background: var(--accent); opacity: 1; }
.card.done .chk svg { opacity: 1; }
.card.done .tile, .card.done .ttl { opacity: .38; filter: grayscale(1); transition: opacity .3s, filter .3s; }
.card.done .ttl { text-decoration: line-through; text-decoration-thickness: 3px; }
.card.pop .chk { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.card.pop { animation: bump .45s ease both; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* Effekte beim Abhaken (Sterne) und wenn alles geschafft ist (Konfetti) */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
.bit { position: absolute; font-size: 30px; margin: -15px 0 0 -15px; animation: bit .95s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes bit { 0% { transform: translate(0, 0) scale(.3); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(50deg); opacity: 0; } }
.fall { position: absolute; top: -60px; font-size: var(--s, 34px); animation: fall var(--t, 2.8s) linear var(--d, 0s) forwards; }
@keyframes fall { to { transform: translateY(calc(100vh + 140px)) rotate(var(--r, 180deg)); } }
.card.leaving { animation: leave .42s ease forwards; pointer-events: none; }
.card.yay .tile { background: var(--soft); }
@media (max-width: 640px) { .chk { top: 16px; right: 16px; width: 38px; height: 38px; } .chk svg { width: 22px; height: 22px; } }
@keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
@keyframes leave { to { opacity: 0; transform: scale(.86); } }

.card.enter, .icard.enter { animation: appear .5s ease both; }
.card.enter:nth-child(2) { animation-delay: .06s; }
.card.enter:nth-child(3) { animation-delay: .12s; }
.card.enter:nth-child(4) { animation-delay: .18s; }
@keyframes appear { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
:root[data-mode="leise"] .card, :root[data-mode="abend"] .card { box-shadow: none; }
:root[data-mode="abend"] .star.on { filter: saturate(.85) brightness(.9); }

/* Tablet quer: alles auf einen Bildschirm, ohne Scrollen */
@media (orientation: landscape) and (min-width: 900px) and (min-height: 560px) {
  .app {
    height: calc(100vh - 96px - env(safe-area-inset-top, 0px) - 2 * env(safe-area-inset-bottom, 0px));
    height: calc(100dvh - 96px - env(safe-area-inset-top, 0px) - 2 * env(safe-area-inset-bottom, 0px));
    grid-template-rows: auto auto minmax(0, 1fr);
    gap: 20px; padding-block: 18px 18px;
  }
  #main { min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .progress { flex: none; }
  .cards { flex: 1 1 0; max-height: 440px; min-height: 0; grid-template-rows: minmax(0, 1fr) auto; row-gap: 0; align-items: stretch; grid-template-columns: repeat(var(--cols, 3), minmax(0, 264px)); }
  /* Infokarten rechts neben den Aufgaben */
  .cards.has-info { grid-template-columns: repeat(var(--tcols, 3), minmax(0, 264px)) minmax(0, 264px); }
  .cards.only-info { grid-template-columns: minmax(0, 300px); }
  .info { grid-column: -2 / -1; grid-row: 1 / span 2; min-height: 0; display: flex; flex-direction: column; }
  .icard { flex: 1 1 0; min-height: 0; overflow: hidden; align-content: center; }
  .icard.kleid { flex-grow: 1.6; }
  .info.two .plate { width: 68px; }
  .wear { font-size: 46px; }
  /* eine Infokarte allein: hochkant mit großem Teller */
  .info:not(.two) .icard { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; row-gap: 12px; padding: 14px; }
  .info:not(.two) .plate { width: min(150px, 72%, 22vh); }
  .info:not(.two) .icard .ttl { font-size: 22px; }
  .info:not(.two) .icard .mm { font-size: 15px; }
  .note { flex: none; }
  @media (max-height: 760px) { .icard.kleid .wx, .info.two .icard.meal .mm { display: none; } .wear { font-size: 38px; padding: 6px 14px; } }
  .card { min-height: 0; grid-template-rows: minmax(0, 1fr) auto; }
  @supports (grid-template-rows: subgrid) {
    /* gleiche Kachelhöhe in allen Karten, auch wenn ein Titel zwei Zeilen hat */
    .card { grid-row: span 2; grid-template-rows: subgrid; row-gap: 14px; }
  }
  .tile { aspect-ratio: auto; height: 100%; min-height: 90px; }
  .card .ttl { font-size: 26px; }
}

/* Nacht */
.night { min-height: 62vh; display: grid; place-items: center; text-align: center; border: 0; background: transparent; width: 100%; padding: 40px 0; }
.night .inner { display: grid; gap: 14px; justify-items: center; }
.night .clock { font-size: 64px; color: var(--fg); }
.night .emo { font-size: 72px; opacity: .55; }
.night p { color: var(--muted); font-size: 17px; }
.peekbar { justify-self: center; color: var(--muted); font-size: 15px; }

/* Vorschau (nur Entwurf) */
.preview { border: 1px dashed var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 12px; }
.pv-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.pv-head b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.pv-head span { color: var(--muted); font-size: 15px; }
.pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pv-row .lbl { width: 72px; color: var(--muted); font-size: 15px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button, .pvbtn { border: 1px solid var(--line); background: var(--surface); min-height: 44px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 15.5px; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chips .emo { font-size: 18px; }
#pv-date { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--surface); }
.switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; cursor: pointer; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.pv-info { color: var(--muted); font-size: 14.5px; }
.foot { color: var(--muted); font-size: 13.5px; text-align: center; }
:root[data-mode="nacht"] .preview, :root[data-mode="nacht"] .foot { --fg: #A39A8F; --muted: #7A7369; --line: #2A2723; --surface: #12110F; --ink: #A39A8F; --on-ink: #050505; color: var(--fg); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="head" id="head"></header>
  <div class="daybar" id="daybar" aria-hidden="true"></div>
  <main id="main" aria-live="polite"></main>
</div>
<div class="fx" id="fx" aria-hidden="true"></div>
<script src="../core.js?v=20261113g"></script>
<script src="effekte.js?v=20261113g"></script>
<script>(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const { esc, pad, iso, parse, addDays, list } = FZ;
  const WD = FZ.WD;
  const WD_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const toMin = FZ.toMin;
  const fmtTime = (min) => Math.floor(min / 60) + ":" + pad(min % 60);
  function emojiCount(s) {
    const t = String(s || "").replace(/\s+/g, "");
    try { if (window.Intl && Intl.Segmenter) return [...new Intl.Segmenter("de", { granularity: "grapheme" }).segment(t)].length; } catch (e) { /* weiter unten */ }
    return t.replace(/[️‍]/g, "").length > 2 ? 2 : 1;
  }
  const emojiClass = (s) => { const n = emojiCount(s); return n >= 3 ? " many" : n === 2 ? " two" : ""; };

  function aufgaben() {
    return FZ.reiter("Kinderaufgaben").filter((r) => r.ID).map((r) => ({
      id: r.ID, text: r.Text, emoji: r.Emoji, phasen: r.Tagesphasen, wochentage: r.Wochentage, wann: (r.Wann || "immer").trim(),
      aktiv: String(r.Aktiv || "").trim().toLowerCase(), rf: Number(r.Reihenfolge) || 99,
      erledigt: String(r["Erledigt am"] || "").trim()
    }));
  }
  // In diesen Tageszeiten lassen sich Aufgaben abhaken. Pro Tageszeit stehen höchstens MAX Aufgaben da;
  // erledigte verschwinden, die nächsten rücken nach. Am nächsten Tag ist alles wieder offen.
  const ABHAKEN = ["morgen", "abend"];
  const MAX = 3;
  const FADE_MS = 2600, LEAVE_MS = 420;
  const fading = new Map(); // id -> { timer, leaving }
  let popId = "", popStar = false, shown = new Set(), lastPhase = "";
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  function itemsFor(phase, s) {
    const today = FZ.dayInfo(s), tomorrow = FZ.dayInfo(addDays(s, 1));
    const w = WD[parse(s).getDay()];
    return aufgaben().filter((k) => {
      if (k.aktiv !== "ja") return false;
      if (!(FZ.phaseMatch ? FZ.phaseMatch(list(k.phasen), phase.id) : list(k.phasen).includes(phase.id))) return false;
      const tage = list(k.wochentage);
      if (tage.length && !tage.includes(w)) return false;
      if (k.wann === "kita") return today.kita;
      if (k.wann === "zuhause") return !today.kita;
      if (k.wann === "vor_kita") return tomorrow.kita;
      return true;
    }).sort((a, b) => a.rf - b.rf);
  }
  function nextPhase(P, cur) { const i = P.indexOf(cur); return P[(i + 1) % P.length]; }

  const DAY_START = 360, DAY_END = 1260;
  function renderDaybar(P, phase, min) {
    const segs = P.filter((p) => p.id !== "nacht" && toMin(p.start) >= DAY_START && toMin(p.ende) <= DAY_END);
    let h = '<div class="track">';
    for (const p of segs) {
      const a = toMin(p.start), b = toMin(p.ende);
      const cls = p === phase ? " on" : min >= b ? " past" : "";
      h += '<div class="seg' + cls + '" style="--w:' + (b - a) + ";--phc:" + (p.farbe || "#F2A93B") + '"><span class="emo">' + esc(p.symbol) + "</span></div>";
    }
    if (min >= DAY_START && min < DAY_END) {
      const idx = Math.max(0, segs.findIndex((p) => min >= toMin(p.start) && min < toMin(p.ende)));
      const frac = (min - DAY_START) / (DAY_END - DAY_START);
      h += '<div class="marker" style="left:calc(' + (frac * 100).toFixed(2) + "% + " + (idx * 4 - frac * (segs.length - 1) * 4).toFixed(1) + 'px)"></div>';
    }
    h += '</div><div class="ticks">';
    const marks = [DAY_START].concat(segs.map((p) => toMin(p.ende)));
    marks.forEach((m, i) => {
      const left = ((m - DAY_START) / (DAY_END - DAY_START)) * 100;
      h += '<span class="' + (i === 0 || i === marks.length - 1 ? "" : "mid") + '" style="left:' + left.toFixed(2) + '%">' + fmtTime(m) + "</span>";
    });
    return h + "</div>";
  }
  // Infokarte Abendessen: steht hinter den Aufgaben und sieht anders aus (runder Teller, kein Haken)
  // Kita-Zeit: wie lange noch bis zum Abholen, als Stundenbalken
  // Wer in den Kindergarten geht: Einstellung kita_kinder (z. B. „Ruby“ oder „Ruby, Elli“), sonst Ruby
  function kitaText() {
    const k = String(FZ.einst().kita_kinder || "Ruby").split(",").map((x) => x.trim()).filter(Boolean);
    return (k.length > 1 ? k.slice(0, -1).join(", ") + " und " + k[k.length - 1] + " sind" : k[0] + " ist") + " im Kindergarten";
  }
  function kitaCard(phase, min) {
    const a = toMin(phase.start), b = toMin(phase.ende), n = Math.max(1, Math.round((b - a) / 60)), done = Math.max(0, Math.min(n, Math.floor((min - a) / 60)));
    return { id: "kita", html: '<article class="icard meal kita"><span class="plate"><span class="emo" aria-hidden="true">🎒</span></span><span class="itxt"><small class="lbl">Abholen um ' + fmtTime(b) + ' Uhr</small><b class="ttl">' + esc(kitaText()) + '</b>' +
      '<span class="hours" aria-label="' + done + " von " + n + ' Stunden vorbei">' + Array.from({ length: n }, (_, i) => '<i class="' + (i < done ? "on" : "") + '"></i>').join("") + "</span></span></article>" };
  }
  function mealCard(date) {
    const m = FZ.meal(date), m2 = FZ.meal(addDays(date, 1));
    if (!m && !m2) return null;
    const name = !m ? "Noch nicht geplant" : m.status === "gericht" ? m.name : m.kid;
    const vis = m && m.bild ? '<img src="' + esc(m.bild) + '" alt="">' : '<span class="emo' + emojiClass(m ? m.emoji : "❔") + '" aria-hidden="true">' + esc(m ? m.emoji : "❔") + "</span>";
    return { id: "meal", html: '<article class="icard meal"><span class="plate">' + vis + '</span><span class="itxt"><small class="lbl">' + (m && m.status === "gericht" && FZ.abendessenFertig && FZ.abendessenFertig(date) ? "Heute gab es" : "Heute Abend") + '</small><b class="ttl">' + esc(name) + "</b>" +
      (m2 ? '<span class="mm">Morgen: <b>' + esc(m2.name) + "</b></span>" : "") + "</span></article>" };
  }

  /* ---------- Anziehen nach Wetter (Open-Meteo, Chemnitz) – nur morgens ---------- */
  // Grundlage ist die gefühlte Temperatur zwischen 7 und 17 Uhr, dazu Regen und Schnee.
  let kleid = null;
  try { kleid = JSON.parse(localStorage.getItem("fz.kleidung") || "null"); } catch (e) { kleid = null; }
  async function loadKleidung() {
    try {
      const u = "https://api.open-meteo.com/v1/forecast?latitude=50.83&longitude=12.92&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code&timezone=Europe%2FBerlin&forecast_days=1";
      const j = await (await fetch(u, { cache: "no-store" })).json();
      const H = j && j.hourly;
      if (!H || !Array.isArray(H.time) || !H.time.length) return;
      const idx = H.time.map((t, i) => [Number(String(t).slice(11, 13)), i]).filter(([h]) => h >= 7 && h <= 17).map(([, i]) => i);
      const pick = (k) => idx.map((i) => (H[k] || [])[i]).filter((v) => typeof v === "number");
      const te = pick("temperature_2m"), ap = pick("apparent_temperature"), pp = pick("precipitation_probability"), pr = pick("precipitation"), wc = pick("weather_code");
      if (!te.length) return;
      const f = ap.length ? ap : te;
      kleid = {
        datum: String(H.time[0]).slice(0, 10),
        fmin: Math.round(Math.min(...f)), fmax: Math.round(Math.max(...f)), tmin: Math.round(Math.min(...te)), tmax: Math.round(Math.max(...te)),
        regen: pp.length ? Math.max(...pp) : null, menge: pr.reduce((a, b) => a + b, 0),
        schnee: wc.some((c) => (c >= 71 && c <= 77) || c === 85 || c === 86),
        sonne: wc.length > 0 && wc.filter((c) => c <= 1).length >= wc.length / 2,
        zeit: Date.now()
      };
      try { localStorage.setItem("fz.kleidung", JSON.stringify(kleid)); } catch (e) { /* ignorieren */ }
      render();
    } catch (e) { /* ohne Wetter keine Anzieh-Karte */ }
  }
  function anziehen(k) {
    let emo, txt, dazu = "";
    if (k.fmin < 2) { emo = ["🧥", "🧤"]; txt = "Winterjacke, Mütze und Handschuhe"; }
    else if (k.fmin < 8) { emo = ["🧥", "🧣"]; txt = "Warme Jacke und Mütze"; }
    else if (k.fmin < 14) { emo = ["🧥"]; txt = "Jacke"; }
    else if (k.fmin < 19) { emo = ["🧥"]; txt = "Dünne Jacke"; }
    else if (k.fmax >= 25) { emo = ["👕", "🩳"]; txt = "T-Shirt und kurze Hose"; }
    else { emo = ["👕"]; txt = "T-Shirt"; }
    const nass = (k.regen != null && k.regen >= 50) || k.menge >= 1;
    if (k.schnee) { emo.push("❄️"); dazu = "Schneehose und Stiefel"; }
    else if (nass) { emo.push("☔"); dazu = k.fmin < 14 ? "Regenhose und Gummistiefel" : "Regenjacke und Gummistiefel"; }
    else if (k.sonne && k.fmax >= 22) { emo.push("🧢"); dazu = "Sonnenhut und Sonnencreme"; }
    return { emo: emo.join(""), txt, dazu };
  }
  function clothesCard(date) {
    if (!kleid || kleid.datum !== date) return null;
    const a = anziehen(kleid);
    const wetter = kleid.tmin + "° bis " + kleid.tmax + "°" + (kleid.regen != null ? " · Regen " + Math.round(kleid.regen) + " %" : "");
    return { id: "kleid", html: '<article class="icard kleid"><span class="wear emo" aria-hidden="true">' + a.emo + '</span><span class="itxt"><small class="lbl">Heute anziehen</small><b class="ttl">' + esc(a.txt) + "</b>" +
      (a.dazu ? '<span class="mm">dazu <b>' + esc(a.dazu) + "</b></span>" : "") + '<span class="mm wx">' + esc(wetter) + "</span></span></article>" };
  }
  const CHECK = '<span class="chk" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>';
  function taskCard(k, check) {
    const inner = '<span class="tile"><span class="emo' + emojiClass(k.emoji) + '" aria-hidden="true">' + esc(k.emoji) + '</span></span><span class="ttl">' + esc(k.text) + "</span>";
    if (!check) return { id: k.id, html: '<article class="card">' + inner + "</article>" };
    const f = fading.has(k.id);
    return { id: k.id, html: '<button type="button" class="card task' + (f ? " done" : "") + (popId === k.id ? " pop" : "") + '" data-id="' + esc(k.id) + '" aria-pressed="' + f + '" aria-label="' + esc(k.text) + (f ? " – erledigt, nochmal tippen macht es rückgängig" : " – antippen, wenn erledigt") + '">' + inner + CHECK + "</button>" };
  }

  let peekUntil = 0, peekTimer = null;
  function render() {
    const now = new Date(), date = iso(now), min = now.getHours() * 60 + now.getMinutes();
    const P = FZ.phasen();
    const phase = FZ.phaseAt(min, P);
    const peek = phase.modus === "nacht" && Date.now() < peekUntil;
    const root = document.documentElement;
    root.dataset.phase = phase.id;
    root.dataset.mode = peek ? "abend" : phase.modus;
    if (FZ.gate($("#main"))) { $("#head").hidden = true; $("#daybar").hidden = true; return; }

    const info = FZ.dayInfo(date);
    const nxt = nextPhase(P, phase);
    const d = parse(date);
    const dateTxt = WD_LONG[d.getDay()] + ", " + d.getDate() + ". " + d.toLocaleDateString("de-DE", { month: "long" });
    const items = itemsFor(phase, date);

    if (phase.modus === "nacht" && !peek) {
      $("#head").hidden = true;
      $("#daybar").hidden = true;
      $("#main").innerHTML = '<button type="button" class="night" id="night" aria-label="Kurz die Kinderseite zeigen"><span class="inner">' +
        '<span class="clock">' + fmtTime(min) + '</span><span class="emo">😴</span><p>Schlafenszeit · Antippen zeigt kurz die Seite</p></span></button>';
      lastPhase = "nacht"; shown = new Set();
      return;
    }

    $("#head").hidden = false;
    $("#daybar").hidden = false;
    $("#head").innerHTML =
      '<div class="now"><span class="eyebrow">Jetzt ist</span>' +
      '<h1><span class="emo">' + esc(phase.symbol) + "</span>" + esc(phase.name) + "</h1>" +
      '<p class="sub">bis ' + fmtTime(toMin(phase.ende)) + " Uhr · danach <b>" + esc(nxt.name) + "</b> " + '<span class="emo">' + esc(nxt.symbol) + "</span></p></div>" +
      '<div class="side"><div class="clock">' + fmtTime(min) + '</div><div class="date">' + esc(dateTxt) + "</div>" +
      (info.kita && !(FZ.kitaVorbei && FZ.kitaVorbei(date, min))
        ? '<div class="daychip"><span class="emo">🏫</span>Kita-Tag</div>'
        : '<div class="daychip"><span class="emo">🏠</span>' + esc(FZ.tagText ? FZ.tagText(info, true) : "Zuhause, heute keine Kita") + "</div>") +
      "</div>";
    $("#daybar").innerHTML = renderDaybar(P, phase, min);

    // Offene Aufgaben (erledigte von heute fallen weg), davon höchstens MAX
    const check = ABHAKEN.includes(phase.id) && !peek;
    const open = (check ? items.filter((k) => k.erledigt !== date) : items).filter((k) => !(phase.id === "kita" && k.wann === "kita"));
    const cards = [];
    open.slice(0, MAX).forEach((k) => cards.push(taskCard(k, check)));
    if (check && items.length && !open.length) {
      cards.push({ id: "yay", html: '<article class="card yay"><span class="tile"><span class="emo" aria-hidden="true">🎉</span></span><span class="ttl"><small>Super gemacht!</small>Alles geschafft</span></article>' });
    }
    // Infokarten hinter den Aufgaben: morgens Anziehen nach Wetter, immer das Abendessen
    const infos = [];
    if (phase.id === "morgen" && !peek) { const cc = clothesCard(date); if (cc) infos.push(cc); }
    if (phase.id === "kita") infos.unshift(kitaCard(phase, min));
    if (phase.modus !== "nacht") { const mc = mealCard(date); if (mc) infos.push(mc); }

    // Nur neue Karten einblenden (Tageszeit-Wechsel: alle)
    const phaseChanged = phase.id !== lastPhase;
    lastPhase = phase.id;
    const neu = (c) => (phaseChanged || !shown.has(c.id)) ? c.html.replace(/class="(i?card)/, 'class="$1 enter') : c.html;
    const html = cards.map(neu), ihtml = infos.map(neu);
    shown = new Set(cards.concat(infos).map((c) => c.id));
    popId = "";

    // Fortschritt: ein Stern pro Aufgabe dieser Tageszeit
    let h = "";
    if (check && items.length) {
      const done = items.filter((k) => k.erledigt === date || fading.has(k.id)).length;
      h += '<div class="progress" role="img" aria-label="' + done + " von " + items.length + ' Aufgaben geschafft"><span class="stars">' +
        items.map((_, i) => i < done ? '<span class="star on emo' + (popStar && i === done - 1 ? " pop" : "") + '">⭐</span>' : '<span class="star off"></span>').join("") +
        '</span><span class="ptxt"><b>' + done + "</b> von " + items.length + "</span></div>";
    }
    popStar = false;

    const t = cards.length;
    h += t || infos.length
      ? '<div class="cards' + (infos.length ? (t ? " has-info" : " only-info") : "") + '" style="--cols:' + Math.max(1, t) + ";--tcols:" + t + ";--mcols:" + Math.min(Math.max(1, t), 2) + '">' + html.join("") +
        (infos.length ? '<div class="info' + (infos.length > 1 ? " two" : "") + '">' + ihtml.join("") + "</div>" : "") + "</div>"
      : '<p class="note">Gerade steht nichts an.</p>';
    if (peek) h += '<p class="peekbar">Gleich wird es wieder dunkel.</p>';
    $("#main").innerHTML = h;
  }

  // Abhaken: Karte wird grau mit Haken, nach kurzer Zeit verschwindet sie und die nächste rückt nach.
  // Nochmal Tippen, solange sie grau ist, macht es rückgängig.
  function toggleTask(id) {
    const f = fading.get(id);
    if (f) {
      if (f.leaving) return;
      clearTimeout(f.timer); fading.delete(id); render(); return;
    }
    const entry = { leaving: false, timer: 0 };
    entry.timer = setTimeout(() => {
      entry.leaving = true;
      const el = document.querySelector('.card[data-id="' + id.replace(/"/g, "") + '"]');
      if (el) el.classList.add("leaving");
      setTimeout(() => commit(id), LEAVE_MS);
    }, FADE_MS);
    fading.set(id, entry);
    popId = id; popStar = true;
    render();
    burst(document.querySelector('.card[data-id="' + id.replace(/"/g, "") + '"]'));
  }
  // Sterne sprühen aus der abgehakten Karte
  function burst(el) {
    if (FZ.kinderEffekt) return FZ.kinderEffekt(el);
    const fx = $("#fx");
    if (!fx || !el || reduced.matches) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.42;
    ["⭐", "✨", "🌟", "⭐", "✨", "💛", "⭐", "✨", "🌟", "⭐", "✨", "💛"].forEach((e, i, all) => {
      const s = document.createElement("span");
      const a = (i / all.length) * 2 * Math.PI + Math.random() * 0.5, d = 100 + Math.random() * 90;
      s.className = "bit emo"; s.textContent = e;
      s.style.left = cx + "px"; s.style.top = cy + "px";
      s.style.setProperty("--dx", (Math.cos(a) * d).toFixed(0) + "px"); s.style.setProperty("--dy", (Math.sin(a) * d).toFixed(0) + "px");
      fx.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    });
  }
  // Konfetti, wenn die letzte Aufgabe der Tageszeit geschafft ist
  function celebrate() {
    if (FZ.kinderBonus) return setTimeout(FZ.kinderBonus, 900);
    const fx = $("#fx");
    if (!fx || reduced.matches) return;
    const E = ["🎉", "⭐", "🎈", "✨", "🌟", "💛", "🎊"];
    for (let i = 0; i < 40; i++) {
      const s = document.createElement("span");
      s.className = "fall emo"; s.textContent = E[i % E.length];
      s.style.left = (Math.random() * 100).toFixed(1) + "%";
      s.style.setProperty("--s", (26 + Math.random() * 22).toFixed(0) + "px");
      s.style.setProperty("--t", (2.2 + Math.random() * 1.4).toFixed(2) + "s");
      s.style.setProperty("--d", (Math.random() * 0.9).toFixed(2) + "s");
      s.style.setProperty("--r", (Math.random() * 540 - 270).toFixed(0) + "deg");
      fx.appendChild(s);
      setTimeout(() => s.remove(), 4800);
    }
  }
  function commit(id) {
    fading.delete(id);
    const date = iso(new Date());
    const row = FZ.reiter("Kinderaufgaben").find((r) => r.ID === id);
    if (row) row["Erledigt am"] = date;
    FZ.send([{ art: "setzen", reiter: "Kinderaufgaben", wo: { ID: id }, werte: { "Erledigt am": date } }]);
    render();
    const now = new Date(), items = itemsFor(FZ.phaseAt(now.getHours() * 60 + now.getMinutes()), date);
    if (items.length && !fading.size && items.every((k) => k.erledigt === date)) celebrate();
  }

  $("#main").addEventListener("click", (ev) => {
    const t = ev.target.closest(".card.task[data-id]");
    if (t) { toggleTask(t.dataset.id); return; }
    if (!ev.target.closest("#night")) return;
    peekUntil = Date.now() + 15000;
    render();
    clearTimeout(peekTimer);
    peekTimer = setTimeout(render, 15100);
  });

  FZ.on(render);
  document.body.classList.add("kids");
  FZ.nav("kinder");
  FZ.start();
  render();
  setInterval(render, 20000);
  // Wetter für die Anzieh-Karte: morgens laden und halbstündlich auffrischen
  const morgens = () => { const n = new Date(); return FZ.phaseAt(n.getHours() * 60 + n.getMinutes()).id === "morgen"; };
  const kleidAlt = () => !kleid || kleid.datum !== iso(new Date()) || Date.now() - (kleid.zeit || 0) > 30 * 60000;
  if (morgens() && kleidAlt()) loadKleidung();
  setInterval(() => { if (morgens() && kleidAlt()) loadKleidung(); }, 5 * 60000);
})();
</script>
</body>
</html>
