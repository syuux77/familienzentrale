<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familie">
<title>Haushalt · Familienzentrale</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}*{-webkit-touch-callout:none}</style>
<style>
:root {
  /* Layout: Kopfzeile mit Reitern · Heute = Leiste „Für alle“ über zwei Personenspalten (Christian | Lisa) · Statistik = Kennzahlen, Diagramme, Aufgabentabelle */
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --surface-2: #ECEEEA;
  --line: #DEE1DB;
  --fg: #1B1F1C;
  --muted: #5F6761;
  --ink: #1B1F1C;
  --on-ink: #FFFFFF;
  --scrim: rgba(20, 24, 21, .42);
  --chris: #2C5FC4;
  --chris-soft: #E4ECFA;
  --lisa: #1D8155;
  --lisa-soft: #DDF0E5;
  --shared: #6E6656;
  --shared-soft: #EFECE5;
  --due: #8A5F1C;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --a-morgen: #C8662A;  --s-morgen: #FBE8D9;
  --a-tag: #2A6FB0;     --s-tag: #E0ECF8;
  --a-leise: #6D669C;   --s-leise: #E6E3F2;
  --a-abend: #C98B3E;   --s-abend: #F6E9D6;
  --accent: var(--a-tag);
  --soft: var(--s-tag);
  --r: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1B1F1C; --surface-2: #252A26; --line: #323833; --a-morgen: #F0A06A; --s-morgen: #3A2717; --a-tag: #86B4E8; --s-tag: #1B2A3B; --a-leise: #ABA4D8; --s-leise: #26233A; --a-abend: #E2B06C; --s-abend: #33271A;
    --fg: #E7EBE6; --muted: #9AA39C; --ink: #E7EBE6; --on-ink: #141715; --scrim: rgba(0,0,0,.6);
    --chris: #86A9F0; --chris-soft: #1F2C45; --lisa: #63C897; --lisa-soft: #17352A;
    --shared: #C8BEA9; --shared-soft: #2C2922; --due: #E0B067;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1B1F1C; --surface-2: #252A26; --line: #323833; --a-morgen: #F0A06A; --s-morgen: #3A2717; --a-tag: #86B4E8; --s-tag: #1B2A3B; --a-leise: #ABA4D8; --s-leise: #26233A; --a-abend: #E2B06C; --s-abend: #33271A;
  --fg: #E7EBE6; --muted: #9AA39C; --ink: #E7EBE6; --on-ink: #141715; --scrim: rgba(0,0,0,.6);
  --chris: #86A9F0; --chris-soft: #1F2C45; --lisa: #63C897; --lisa-soft: #17352A;
  --shared: #C8BEA9; --shared-soft: #2C2922; --due: #E0B067;
  color-scheme: dark;
}

/* Phase bestimmt die Akzentfarbe (wie Start- und Kinderseite) */
:root[data-phase="morgen"] { --accent: var(--a-morgen); --soft: var(--s-morgen); }
:root[data-phase="tag"] { --accent: var(--a-tag); --soft: var(--s-tag); }
:root[data-phase="leisezeit"] { --accent: var(--a-leise); --soft: var(--s-leise); }
:root[data-phase="abend"], :root[data-phase="nacht"] { --accent: var(--a-abend); --soft: var(--s-abend); }

/* Leisezeit: ruhig, weich, leicht gedimmt */
:root[data-mode="leise"] {
  --bg: #E7E6EC; --surface: #F1F0F5; --surface-2: #DFDDE8; --line: #D6D4DF; --fg: #34323F; --muted: #6C6A7A; --ink: #34323F; --on-ink: #F1F0F5;
  --accent: #6D669C; --soft: #E0DDEC; --shared-soft: #E4E1E6; --food-soft: #ECE3DA;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-mode="leise"] {
    --bg: #141319; --surface: #1C1B23; --surface-2: #272530; --line: #2C2A36; --fg: #C9C5D6; --muted: #8A8699; --ink: #C9C5D6; --on-ink: #141319;
    --accent: #9E97C9; --soft: #25233A; --shared-soft: #2A2730; --food-soft: #332A22;
  }
}
:root[data-theme="dark"][data-mode="leise"] {
  --bg: #141319; --surface: #1C1B23; --surface-2: #272530; --line: #2C2A36; --fg: #C9C5D6; --muted: #8A8699; --ink: #C9C5D6; --on-ink: #141319;
  --accent: #9E97C9; --soft: #25233A; --shared-soft: #2A2730; --food-soft: #332A22;
}
/* Abend und Nacht: warm, stark abgedunkelt (gleich in beiden Themes) */
:root[data-mode="abend"] {
  --bg: #17120D; --surface: #211A13; --surface-2: #2C2319; --line: #33281D; --fg: #E6D5BF; --muted: #A28D74; --ink: #E6D5BF; --on-ink: #17120D;
  --scrim: rgba(0, 0, 0, .62);
  --accent: #D9A15A; --soft: #2E2318;
  --chris: #8FA9C9; --chris-soft: #232B35; --lisa: #8DB89A; --lisa-soft: #222E25;
  --ruby: #D69AB3; --ruby-soft: #36232B; --shared: #B5A48D; --shared-soft: #2C251C;
  --food: #D9A15A; --food-soft: #33271A; --due: #E2A06C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 17px/1.42 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; transition: background-color .6s ease, color .6s ease; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.chris { --pc: var(--chris); --pc-soft: var(--chris-soft); }
.lisa { --pc: var(--lisa); --pc-soft: var(--lisa-soft); }
.offen { --pc: var(--shared); --pc-soft: var(--shared-soft); }

.app {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: grid; gap: 22px;
}

/* Kopfzeile */
.top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px 20px; }
.title h1 { font: 700 40px/1.05 var(--font-display); letter-spacing: -.02em; display: flex; align-items: center; gap: 12px; }
.title h1 svg { width: 34px; height: 34px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.title p { color: var(--muted); font-size: 16px; margin-top: 4px; }
.tabs { justify-self: center; display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 10px 20px; min-height: 46px; border-radius: 999px; font-weight: 600; font-size: 16px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn { border: 1px solid var(--line); background: var(--surface); min-height: 48px; padding: 0 20px; border-radius: 999px; font-weight: 650; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.top .btn { white-space: nowrap; }
.btn svg { width: 20px; height: 20px; }
.newbtn .lbl-short { display: none; }
@media (max-width: 700px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; }
  .title { display: contents; }
  .title h1 { grid-column: 1; grid-row: 1; }
  .title p { grid-column: 1 / -1; grid-row: 2; margin-top: -4px; }
  .top > .btn, #topaction { grid-column: 2; grid-row: 1; }
  .tabs { grid-column: 1 / -1; grid-row: 3; justify-self: stretch; }
  .tabs button { flex: 1; padding: 10px 6px; font-size: 15px; white-space: nowrap; }
  .title h1 { min-width: 0; }
  .title h1 { font-size: 30px; gap: 10px; }
  .title h1 svg { width: 28px; height: 28px; }
  .title p { font-size: 15px; }
}

@media (max-width: 400px) { .title h1 svg { display: none; } .top .btn { padding: 0 14px; font-size: 15px; } }

.eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border-radius: var(--r); box-shadow: 0 1px 0 var(--line); padding: 18px 20px 20px; }

/* Heute */
.shared { display: grid; gap: 6px; }
.shared-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.shared-head p { color: var(--muted); font-size: 14.5px; }
.shared-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); column-gap: 28px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } .shared-list { grid-template-columns: 1fr; } }
.colhead { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.colhead h2 { font: 700 21px/1.2 var(--font-display); color: var(--pc); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); flex: none; }
.colhead .colstat { margin-left: auto; color: var(--muted); font-size: 14.5px; }
.colhead .colstat b { color: var(--fg); font-weight: 650; }

.task { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 44px; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list > .task:last-child, .shared-list > .task { border-bottom-color: var(--line); }
.list > .task:last-child { border-bottom: 0; }
.check { width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--pc); background: transparent; color: var(--pc); display: grid; place-items: center; padding: 0; transition: background .15s, transform .1s; }
.check svg { width: 26px; height: 26px; opacity: .22; transition: opacity .15s; }
.check:hover, .check:focus-visible { background: var(--pc-soft); }
.check:hover svg, .check:focus-visible svg { opacity: 1; }
.check:active { transform: scale(.93); background: var(--pc); color: var(--surface); }
.check:active svg { opacity: 1; }
.ttitle { font-weight: 620; font-size: 18px; line-height: 1.25; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.tmeta { color: var(--muted); font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; }
.tmeta .due { color: var(--due); font-weight: 600; }
.pts { font-size: 14px; font-weight: 650; color: var(--pc); background: var(--pc-soft); border-radius: 999px; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.more { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; color: var(--muted); display: grid; place-items: center; padding: 0; }
.more:hover { background: var(--surface-2); }
.more svg { width: 22px; height: 22px; }
/* Handy: Punkte unter den Titel, damit der Titel die ganze Breite hat */
@media (max-width: 520px) {
  .task { grid-template-columns: 48px minmax(0, 1fr) 40px; gap: 4px 12px; }
  .task .check { width: 48px; height: 48px; grid-row: 1 / span 2; }
  .task .more { width: 40px; grid-column: 3; grid-row: 1 / span 2; }
  .task .pts { grid-column: 2; grid-row: 2; justify-self: start; }
}
.empty { color: var(--muted); padding: 18px 0 8px; font-size: 16px; }
.donelist { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 6px; }
.donelist h3 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.done { display: grid; grid-template-columns: 22px minmax(0,1fr) auto auto; gap: 10px; align-items: center; color: var(--muted); font-size: 15px; }
.done svg { width: 18px; height: 18px; color: var(--pc); }
.done .t { overflow-wrap: anywhere; }

.soon h2 { margin-bottom: 6px; }
.srow { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.srow:last-child { border-bottom: 0; }
.srow .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.who { font-size: 13.5px; font-weight: 650; color: var(--pc); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.who::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
@media (max-width: 520px) { .srow { grid-template-columns: 1fr auto; } .srow .d { grid-column: 1 / -1; font-size: 14px; } .srow .who { display: none; } }

/* Alle Aufgaben */
.group { display: grid; gap: 4px; }
.group + .group { margin-top: 10px; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 24px; gap: 14px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 12px 4px; min-height: 60px; border-radius: 0; }
.arow:last-child { border-bottom: 0; }
.arow:hover { background: var(--surface-2); }
.arow .next { color: var(--muted); font-size: 14.5px; white-space: nowrap; }
.arow > svg { width: 18px; height: 18px; color: var(--muted); }
@media (max-width: 520px) { .arow { grid-template-columns: minmax(0,1fr) auto 18px; } .arow .next { display: none; } }

/* Statistik */
.statbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.seg button { border: 0; background: transparent; min-height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 15.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.weeknav { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.weeknav button { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.weeknav button:disabled { opacity: .35; cursor: default; }
.weeknav svg { width: 20px; height: 20px; }
.weeknav span { min-width: 190px; text-align: center; font-variant-numeric: tabular-nums; }
.note { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--shared-soft); color: var(--fg); border-radius: 18px; padding: 12px 18px; font-size: 15px; }
.note .btn { min-height: 40px; font-size: 15px; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis .kpi.total { grid-column: 1 / -1; } }
.kpi { background: var(--surface); border-radius: var(--r); box-shadow: 0 1px 0 var(--line); padding: 16px 20px; display: grid; gap: 2px; }
.kpi .k { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--pc, var(--fg)); font-size: 15.5px; }
.kpi .v { font: 700 40px/1.1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .v small { font-size: 16px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.kpi .s { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }

.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
.chead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.chead h2 { font-size: 17px; font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--pc); }

.donutwrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; }
.donut { width: 160px; height: 160px; flex: none; }
.donut circle { fill: none; }
.donut .track { stroke: var(--surface-2); }
.donut .c { stroke: var(--chris); }
.donut .l { stroke: var(--lisa); }
.donut text { fill: var(--fg); font-family: var(--font-display); }
.donut .dv { font-size: 30px; font-weight: 700; }
.donut .dl { font-size: 12.5px; fill: var(--muted); }
.shares { display: grid; gap: 10px; min-width: 0; }
.share { display: grid; gap: 1px; }
.share .n { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--pc); font-size: 15px; }
.share .p { font: 700 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.share .p small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 4px; }

.bars { display: grid; grid-template-columns: 34px minmax(0, 1fr); grid-template-rows: 200px auto; column-gap: 8px; }
.yaxis { position: relative; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.yaxis span { position: absolute; right: 0; transform: translateY(50%); }
.plot { position: relative; border-bottom: 1px solid var(--line); }
.gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.bcols { position: absolute; inset: 0; display: flex; gap: 8px; align-items: stretch; }
.bcol { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.bval { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.stack { width: min(46px, 72%); display: flex; flex-direction: column; gap: 2px; }
.stack .sg { border-radius: 5px; min-height: 0; }
.stack .sg.c { background: var(--chris); }
.stack .sg.l { background: var(--lisa); }
.xl { grid-column: 2; display: flex; gap: 8px; margin-top: 6px; }
.xl span { flex: 1; min-width: 0; text-align: center; font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.xl span b { display: block; color: var(--fg); font-size: 13.5px; font-weight: 650; }
.xl span.today b { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

.bd { display: grid; }
.bdrow { display: grid; grid-template-columns: minmax(0, 1.3fr) 92px 92px minmax(120px, 1fr); gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.bdrow:last-child { border-bottom: 0; }
.bdrow.h { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-top: 0; }
.bdrow .c1 { overflow-wrap: anywhere; font-weight: 600; }
.bdrow .c1 small { display: block; color: var(--muted); font-weight: 500; font-size: 13.5px; }
.bdrow .cn { font-variant-numeric: tabular-nums; }
.bdrow .cn.chris { color: var(--chris); font-weight: 650; }
.bdrow .cn.lisa { color: var(--lisa); font-weight: 650; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.split i { display: block; height: 100%; }
.split i.c { background: var(--chris); }
.split i.l { background: var(--lisa); }
@media (max-width: 560px) {
  .bdrow { grid-template-columns: minmax(0, 1fr) 56px 56px; row-gap: 8px; }
  .bdrow .split { grid-column: 1 / -1; }
  .bdrow.h span:last-child { display: none; }
}
.recent .rrow { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.recent .rrow:last-child { border-bottom: 0; }
.recent .rrow .d { color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .recent .rrow { grid-template-columns: minmax(0,1fr) auto; } .recent .rrow .d { grid-column: 1 / -1; font-size: 13.5px; } .recent .rrow .who { display: none; } }

.foot { color: var(--muted); font-size: 13.5px; text-align: center; }

/* Sheet */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); width: min(580px, 100%); max-height: calc(100% - 20px); overflow-y: auto; border-radius: 26px; padding: 24px; display: grid; gap: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.sheet h2 { font: 700 22px/1.2 var(--font-display); }
.sheet .sub { color: var(--muted); margin-top: -10px; }
@media (max-width: 600px) {
  .overlay { place-items: end stretch; padding: 0; }
  .sheet { width: 100%; border-radius: 26px 26px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); max-height: 92%; }
}
.field { display: grid; gap: 8px; }
.field > label, .field .lbl { font-weight: 650; font-size: 15px; }
.field input[type="text"], .field input:not([type]), .field input[type="date"], .field input[type="number"] { min-height: 50px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); width: 100%; font-size: 17px; }
.hint { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--bg); min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 15.5px; color: var(--fg); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chips.days button { min-width: 50px; padding: 0 10px; }
.chips.who button[aria-pressed="true"].chris { background: var(--chris); border-color: var(--chris); color: var(--surface); }
.chips.who button[aria-pressed="true"].lisa { background: var(--lisa); border-color: var(--lisa); color: var(--surface); }
.chips.who button[aria-pressed="true"].offen { background: var(--shared); border-color: var(--shared); color: var(--surface); }
.inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline input { width: 90px !important; text-align: center; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper input { width: 90px !important; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper button { width: 50px; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 22px; font-weight: 600; padding: 0; }
.checkline { display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 44px; }
.checkline input { width: 22px; height: 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.actions .left { margin-right: auto; }
.err { color: var(--due); font-weight: 600; font-size: 15px; }
.confirm { display: grid; gap: 10px; background: var(--surface-2); padding: 14px; border-radius: 18px; }
.menu { display: grid; gap: 8px; }
.menu button { justify-content: flex-start; min-height: 56px; font-size: 17px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick button { min-height: 96px; border-radius: 18px; border: 2px solid var(--pc); background: var(--pc-soft); color: var(--pc); font: 700 21px/1.2 var(--font-display); display: grid; place-items: center; gap: 4px; }
.pick button small { font: 600 14px var(--font); color: var(--muted); }
.cancel { justify-self: center; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(108px + env(safe-area-inset-bottom, 0px)); width: min(640px, calc(100% - 32px)); background: var(--ink); color: var(--on-ink); border-radius: 20px; padding: 10px 10px 10px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; z-index: 60; box-shadow: 0 12px 30px rgba(0,0,0,.22); font-size: 15.5px; }
.toast span { flex: 1 1 220px; }
/* über der Leiste unten, damit sie bedienbar bleibt */
@media (max-width: 560px) { .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }
.toast button { border: 1px solid color-mix(in srgb, var(--on-ink) 35%, transparent); background: transparent; color: var(--on-ink); min-height: 40px; padding: 0 14px; border-radius: 999px; font-weight: 650; font-size: 15px; }

/* Verbindung */
.sync { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; text-align: center; }
.sync .st::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--lisa); margin-right: 7px; vertical-align: 1px; }
.sync.busy .st::before { background: var(--due); }
.sync.err .st { color: var(--due); font-weight: 600; }
.sync.err .st::before { background: var(--due); }
.sync button { border: 1px solid var(--line); background: var(--surface); min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
.setup { max-width: 520px; margin: 40px auto; display: grid; gap: 14px; }
.setup h2 { font: 700 24px/1.2 var(--font-display); }
.setup input { min-height: 50px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); width: 100%; font-size: 17px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
:root[data-mode="leise"] .panel, :root[data-mode="abend"] .panel, :root[data-mode="leise"] .kpi, :root[data-mode="abend"] .kpi { box-shadow: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">
      <h1><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="m8 9 1.6 1.6L12.5 7.7"/><path d="M14.5 9.5H17"/><path d="m8 15 1.6 1.6 2.9-2.9"/><path d="M14.5 15.5H17"/></svg>Haushalt</h1>
      <p id="date"></p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button role="tab" data-act="view" data-view="heute" id="tab-heute">Heute</button>
      <button role="tab" data-act="view" data-view="aufgaben" id="tab-aufgaben">Alle Aufgaben</button>
      <button role="tab" data-act="view" data-view="statistik" id="tab-statistik">Statistik</button>
    </nav>
    <button class="btn primary newbtn" data-act="new" id="btn-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Aufgabe</span>
    </button>
  </header>
  <main id="view" aria-live="polite"></main>
  <div class="sync" id="sync"><span class="st" id="sync-st">Verbinde mit der Google-Tabelle …</span><button type="button" data-act="reload">Jetzt neu laden</button></div>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="../core.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Grundlagen ---------- */
  const KEY = "familie.haushalt.v1";
  const PEOPLE = { chris: { name: "Christian" }, lisa: { name: "Lisa" } };
  const WD_SHORT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const WD_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
  const MON = ["Jan.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sep.", "Okt.", "Nov.", "Dez."];

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>',
    chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
  };

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayIso = () => iso(new Date());
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const dow = (s) => parse(s).getDay();
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const mondayOf = (s) => { const w = dow(s); return addDays(s, w === 0 ? -6 : 1 - w); };
  const fmtShort = (s) => { const d = parse(s); return WD_SHORT[d.getDay()] + ", " + d.getDate() + "." + (d.getMonth() + 1) + "."; };
  const relDay = (s) => { const n = diffDays(todayIso(), s); if (n === 0) return "heute"; if (n === 1) return "morgen"; if (n === 2) return "übermorgen"; return fmtShort(s); };
  const pl = (n) => (n === 1 ? "1 Punkt" : fmtNum(n) + " Punkte");
  const fmtNum = (n) => Number(n).toLocaleString("de-DE", { maximumFractionDigits: 1 });
  const other = (p) => (p === "chris" ? "lisa" : "chris");
  const uid = () => "tmp-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function isoWeek(s) {
    const d = parse(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const w1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  }
  function fmtRange(a, b) {
    const A = parse(a), B = parse(b);
    if (A.getMonth() === B.getMonth()) return A.getDate() + ".–" + B.getDate() + ". " + MON[B.getMonth()];
    return A.getDate() + ". " + MON[A.getMonth()] + " – " + B.getDate() + ". " + MON[B.getMonth()];
  }

  /* ---------- Rhythmus ---------- */
  function rhythmLabel(t) {
    if (t.typ === "einmalig") return "einmalig";
    const r = t.rhythmus;
    if (r.art === "taeglich") return t.mehrfach ? "täglich, auch mehrmals" : "täglich";
    if (r.art === "wochentage") {
      if (r.tage.length === 1) return "jeden " + WD_LONG[r.tage[0]];
      if (r.tage.length === 7) return "täglich";
      return WEEK_ORDER.filter((d) => r.tage.includes(d)).map((d) => WD_SHORT[d]).join(", ");
    }
    if (r.art === "monatlich") return "monatlich am " + r.tag + ".";
    if (r.art === "intervall") return "alle " + r.n + " Tage nach Erledigung";
    return "";
  }
  // nächste Fälligkeit nach Erledigung oder Aussetzen
  function computeNext(t, today) {
    const r = t.rhythmus;
    const base = t.naechste > today ? t.naechste : today;
    if (r.art === "taeglich") return addDays(base, 1);
    if (r.art === "wochentage") {
      let d = addDays(base, 1);
      for (let i = 0; i < 8; i++) { if (r.tage.includes(dow(d))) return d; d = addDays(d, 1); }
      return addDays(base, 7);
    }
    if (r.art === "monatlich") {
      const b = parse(base); const y = b.getFullYear(), m = b.getMonth() + 1;
      const len = new Date(y, m + 1, 0).getDate();
      return iso(new Date(y, m, Math.min(r.tag, len)));
    }
    if (r.art === "intervall") return addDays(today, Math.max(1, r.n));
    return addDays(today, 1);
  }
  // erste Fälligkeit ab einem Datum (inklusive)
  function firstDue(r, from) {
    if (!r) return from;
    if (r.art === "wochentage") {
      let d = from;
      for (let i = 0; i < 7; i++) { if (r.tage.includes(dow(d))) return d; d = addDays(d, 1); }
    }
    if (r.art === "monatlich") {
      const f = parse(from);
      const len = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate();
      let c = new Date(f.getFullYear(), f.getMonth(), Math.min(r.tag, len));
      if (iso(c) < from) {
        const len2 = new Date(f.getFullYear(), f.getMonth() + 2, 0).getDate();
        c = new Date(f.getFullYear(), f.getMonth() + 1, Math.min(r.tag, len2));
      }
      return iso(c);
    }
    return from;
  }

  /* ---------- Verbindung zur Google-Tabelle (Apps Script) ---------- */
    const CACHE = "fz.haushalt.cache.v1";
  const WD_CODE = ["so", "mo", "di", "mi", "do", "fr", "sa"];

  const SETUP = { get key() { return FZ.key; }, set key(v) { FZ.setKey(v); }, get geraet() { return FZ.geraet; } };

  function fromSheet(daten) {
    const ja = (v) => String(v || "").trim().toLowerCase() === "ja";
    const num = (v) => Number(String(v || "").replace(",", ".")) || 0;
    const tasks = (daten.Haushalt || []).filter((r) => r.ID).map((r) => {
      const art = String(r["Rhythmus-Art"] || "").trim();
      const typ = r.Typ === "einmalig" || !art ? "einmalig" : "wiederkehrend";
      let rhythmus = null;
      if (typ === "wiederkehrend") {
        if (art === "wochentage") rhythmus = { art, tage: String(r.Wochentage || "").split(",").map((x) => WD_CODE.indexOf(x.trim().toLowerCase())).filter((n) => n >= 0) };
        else if (art === "monatlich") rhythmus = { art, tag: parseInt(r["Tag im Monat"], 10) || 1 };
        else if (art === "intervall") rhythmus = { art, n: parseInt(r["Intervall in Tagen"], 10) || 7 };
        else rhythmus = { art: "taeglich" };
      }
      const z = r["Zuständig"];
      return {
        id: r.ID, titel: r.Titel || "(ohne Titel)", zustaendig: z === "chris" || z === "lisa" ? z : "offen", typ, rhythmus,
        naechste: /^\d{4}-\d{2}-\d{2}$/.test(r["Nächste Fälligkeit"] || "") ? r["Nächste Fälligkeit"] : todayIso(),
        punkte: num(r.Punkte), aktiv: ja(r.Aktiv), mehrfach: ja(r.Mehrfach)
      };
    });
    const log = (daten.Erledigt || []).filter((r) => r.ID && r.Zeitpunkt && (r["Erledigt von"] === "chris" || r["Erledigt von"] === "lisa")).map((r) => ({
      id: r.ID, aufgabeId: r["Aufgaben-ID"], titel: r.Titel, von: r["Erledigt von"], zeit: String(r.Zeitpunkt).slice(0, 16), punkte: num(r.Punkte), art: r.Art || "erledigt"
    }));
    return { tasks, log };
  }
  function rowOf(t) {
    const r = t.rhythmus || {};
    return {
      "Titel": t.titel, "Zuständig": t.zustaendig, "Typ": t.typ, "Rhythmus-Art": t.typ === "einmalig" ? "" : r.art,
      "Wochentage": r.art === "wochentage" ? WEEK_ORDER.filter((d) => r.tage.includes(d)).map((d) => WD_CODE[d]).join(",") : "",
      "Tag im Monat": r.art === "monatlich" ? String(r.tag) : "", "Intervall in Tagen": r.art === "intervall" ? String(r.n) : "",
      "Nächste Fälligkeit": t.naechste, "Punkte": String(t.punkte), "Mehrfach": t.mehrfach ? "ja" : "nein", "Aktiv": t.aktiv ? "ja" : "nein"
    };
  }
  function stamp(zeit) {
    const d = new Date(+zeit.slice(0, 4), +zeit.slice(5, 7) - 1, +zeit.slice(8, 10), +zeit.slice(11, 13), +zeit.slice(14, 16));
    const off = -d.getTimezoneOffset(), a = Math.abs(off);
    return zeit.slice(0, 16) + ":00" + (off >= 0 ? "+" : "-") + pad(Math.floor(a / 60)) + ":" + pad(a % 60);
  }
  const idMap = {};
  const real = (id) => idMap[id] || id;
  function adoptId(tmp, realId) {
    if (!realId || tmp === realId) return;
    idMap[tmp] = realId;
    S.tasks.forEach((t) => { if (t.id === tmp) t.id = realId; });
    S.log.forEach((e) => { if (e.id === tmp) e.id = realId; if (e.aufgabeId === tmp) e.aufgabeId = realId; });
    save();
  }
  const opTask = (t) => ({ art: "setzen", reiter: "Haushalt", wo: { ID: real(t.id) }, werte: rowOf(t) });
  const opEntry = (e) => ({ art: "anfuegen", reiter: "Erledigt", werte: { "Aufgaben-ID": real(e.aufgabeId), "Titel": e.titel, "Erledigt von": e.von, "Zeitpunkt": stamp(e.zeit), "Punkte": String(e.punkte), "Art": e.art } });
  const opDelEntry = (e) => ({ art: "loeschen", reiter: "Erledigt", wo: { ID: real(e.id) } });

  const apiGet = () => FZ.fetchAll();
  const apiPost = (aktionen) => FZ.post(aktionen);

  let loaded = false, pending = 0, lastSync = null, syncErr = "", reloadMin = 3, queue = Promise.resolve(), idleTimer = null;
  const hhmm = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
  function setSync() {
    const box = $("#sync"), st = $("#sync-st"); if (!box) return;
    box.classList.toggle("busy", pending > 0);
    box.classList.toggle("err", !!syncErr && !pending);
    if (pending) st.textContent = "Speichert in der Google-Tabelle …";
    else if (syncErr) st.textContent = "Keine Verbindung: " + syncErr + (lastSync ? " · Stand von " + hhmm(lastSync) : "");
    else if (lastSync) st.textContent = "Mit der Google-Tabelle verbunden · Stand " + hhmm(lastSync);
    else st.textContent = "Verbinde mit der Google-Tabelle …";
  }
  // Änderungen der Reihe nach in die Tabelle schreiben
  function send(build, after) {
    pending++; setSync();
    queue = queue.then(() => apiPost(build())).then((j) => {
      if (after) after(j);
      lastSync = new Date(); syncErr = "";
    }).catch((err) => {
      syncErr = err.message || "Fehler beim Speichern";
      toast("Nicht gespeichert: " + syncErr + ". Der Stand wird aus der Tabelle neu geladen.");
      setTimeout(() => refresh(true), 1500);
    }).finally(() => {
      pending--; setSync();
      if (!pending) { clearTimeout(idleTimer); idleTimer = setTimeout(() => refresh(false), 20000); }
    });
  }
  function isIdle() { return !pending && $("#overlay").hidden && $("#toast").hidden; }
  async function refresh(force) {
    if (!SETUP.key) return;
    if (!force && !isIdle()) { clearTimeout(idleTimer); idleTimer = setTimeout(() => refresh(false), 15000); return; }
    try {
      const j = await apiGet();
      if (pending) return;
      S = fromSheet(j.daten);
      (j.daten.Einstellungen || []).forEach((r) => { if (r["Schlüssel"] === "neu_laden_minuten") reloadMin = Math.max(1, parseInt(r.Wert, 10) || 3); });
      loaded = true; lastSync = new Date(); syncErr = "";
      save();
      if ($("#overlay").hidden) render();
    } catch (err) {
      syncErr = err.message || "Tabelle nicht erreichbar";
    }
    setSync();
  }

  function load() {
    try {
      const raw = localStorage.getItem(CACHE);
      if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.tasks) && Array.isArray(d.log)) { loaded = true; return d; } }
    } catch (e) { /* kein Speicher verfügbar */ }
    return { tasks: [], log: [] };
  }
  function save() { try { localStorage.setItem(CACHE, JSON.stringify(S)); } catch (e) { /* ignorieren */ } }

  let S = load();
  const ui = { view: "heute", statMode: "woche", weekOffset: 0 };

  /* ---------- Ansicht Heute ---------- */
  function weekSum(p) {
    const from = mondayOf(todayIso()), to = addDays(from, 6);
    return S.log.filter((e) => e.art === "erledigt" && e.von === p && e.zeit.slice(0, 10) >= from && e.zeit.slice(0, 10) <= to).reduce((a, e) => a + e.punkte, 0);
  }
  function taskRow(t) {
    const today = todayIso();
    const meta = [];
    if (t.mehrfach) {
      const tl = S.log.filter((e) => e.art === "erledigt" && e.aufgabeId === t.id && e.zeit.slice(0, 10) === today);
      if (!tl.length) meta.push("<span>heute noch nicht</span>");
      else {
        const c = tl.filter((e) => e.von === "chris").length, l = tl.length - c;
        const parts = []; if (c) parts.push("Christian " + c + "×"); if (l) parts.push("Lisa " + l + "×");
        meta.push("<span>heute " + tl.length + "×: " + parts.join(", ") + "</span>");
      }
    } else {
      meta.push("<span>" + esc(rhythmLabel(t)) + "</span>");
      if (t.naechste < today) {
        const n = diffDays(t.naechste, today);
        meta.push('<span class="due">' + (n === 1 ? "seit gestern fällig" : "seit " + n + " Tagen fällig") + "</span>");
      }
    }
    const who = t.zustaendig;
    return '<div class="task ' + who + '">' +
      '<button class="check" data-act="check" data-id="' + t.id + '" aria-label="' + esc(t.titel) + ' als erledigt eintragen">' + ICON.check + "</button>" +
      '<div><div class="ttitle">' + esc(t.titel) + '</div><div class="tmeta">' + meta.join("") + "</div></div>" +
      '<span class="pts">' + pl(t.punkte) + "</span>" +
      '<button class="more" data-act="menu" data-id="' + t.id + '" aria-label="Weitere Optionen für ' + esc(t.titel) + '">' + ICON.more + "</button>" +
      "</div>";
  }
  function renderHeute() {
    const t = todayIso();
    const due = S.tasks.filter((x) => x.aktiv && x.naechste <= t);
    const sortDue = (a, b) => (a.naechste < b.naechste ? -1 : a.naechste > b.naechste ? 1 : a.titel.localeCompare(b.titel, "de"));
    const shared = due.filter((x) => x.zustaendig === "offen").sort(sortDue);
    const todayLog = S.log.filter((e) => e.art === "erledigt" && e.zeit.slice(0, 10) === t);
    let h = "";
    if (shared.length) {
      h += '<section class="panel shared"><div class="shared-head"><h2 class="eyebrow">Für alle</h2><p>Wer es macht, trägt sich ein und bekommt die Punkte.</p></div>' +
        '<div class="shared-list">' + shared.map(taskRow).join("") + "</div></section>";
    }
    h += '<div class="cols">';
    for (const p of ["chris", "lisa"]) {
      const mine = due.filter((x) => x.zustaendig === p).sort(sortDue);
      const doneMine = todayLog.filter((e) => e.von === p).sort((a, b) => (a.zeit < b.zeit ? 1 : -1));
      h += '<section class="panel col ' + p + '"><header class="colhead"><span class="dot"></span><h2>' + PEOPLE[p].name + "</h2>" +
        '<span class="colstat">Diese Woche <b class="num">' + pl(weekSum(p)) + "</b></span></header>" +
        '<div class="list">' + (mine.length ? mine.map(taskRow).join("") : '<p class="empty">Für heute ist alles erledigt.</p>') + "</div>";
      if (doneMine.length) {
        h += '<div class="donelist"><h3>Heute erledigt</h3>' + doneMine.map((e) =>
          '<div class="done">' + ICON.check + '<span class="t">' + esc(e.titel) + '</span><span class="num">+' + fmtNum(e.punkte) + '</span><span class="num">' + e.zeit.slice(11, 16) + "</span></div>").join("") + "</div>";
      }
      h += "</section>";
    }
    h += "</div>";
    const soon = S.tasks.filter((x) => x.aktiv && !x.mehrfach && x.naechste > t && x.naechste <= addDays(t, 7) && !(x.rhythmus && x.rhythmus.art === "taeglich")).sort(sortDue);
    h += '<section class="panel soon"><h2 class="eyebrow">Demnächst</h2>';
    h += soon.length ? soon.map((x) =>
      '<div class="srow ' + x.zustaendig + '"><span class="d">' + esc(relDay(x.naechste) === fmtShort(x.naechste) ? fmtShort(x.naechste) : relDay(x.naechste) + ", " + fmtShort(x.naechste).split(", ")[1]) + "</span>" +
      "<span>" + esc(x.titel) + '</span><span class="who">' + (x.zustaendig === "offen" ? "Für alle" : PEOPLE[x.zustaendig].name) + '</span><span class="pts">' + pl(x.punkte) + "</span></div>").join("")
      : '<p class="empty">In den nächsten 7 Tagen steht nichts an.</p>';
    h += "</section>";
    return h;
  }

  /* ---------- Ansicht Alle Aufgaben ---------- */
  function renderAufgaben() {
    const groups = [["chris", "Christian"], ["lisa", "Lisa"], ["offen", "Für alle"]];
    let h = '<p class="hint">Tippe auf eine Aufgabe, um Titel, Person, Punkte oder Rhythmus zu ändern.</p>';
    for (const [k, name] of groups) {
      const list = S.tasks.filter((x) => x.aktiv && x.zustaendig === k).sort((a, b) => a.titel.localeCompare(b.titel, "de"));
      if (!list.length && k === "offen") continue;
      h += '<section class="panel group ' + k + '"><header class="colhead"><span class="dot"></span><h2>' + name + '</h2><span class="colstat">' + list.length + (list.length === 1 ? " Aufgabe" : " Aufgaben") + "</span></header>";
      h += list.length ? list.map((x) =>
        '<button class="arow" data-act="edit" data-id="' + x.id + '"><span><span class="ttitle">' + esc(x.titel) + '</span><span class="tmeta"><span>' + esc(rhythmLabel(x)) + "</span></span></span>" +
        '<span class="next">' + (x.mehrfach ? "jeden Tag" : "nächstes Mal " + esc(relDay(x.naechste < todayIso() ? todayIso() : x.naechste))) + "</span>" +
        '<span class="pts">' + pl(x.punkte) + "</span>" + ICON.chevR + "</button>").join("")
        : '<p class="empty">Noch keine Aufgaben.</p>';
      h += "</section>";
    }
    return h;
  }

  /* ---------- Ansicht Statistik ---------- */
  function niceMax(v) {
    if (v <= 0) return 4;
    const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
    const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
    return Math.max(4, n * e);
  }
  function sums(entries) {
    const r = { chris: { p: 0, n: 0 }, lisa: { p: 0, n: 0 } };
    for (const e of entries) { if (r[e.von]) { r[e.von].p += e.punkte; r[e.von].n += 1; } }
    return r;
  }
  function renderStats() {
    const t = todayIso();
    const all = S.log.filter((e) => e.art === "erledigt");
    let entries, from, to, days, buckets;
    if (ui.statMode === "woche") {
      from = addDays(mondayOf(t), 7 * ui.weekOffset); to = addDays(from, 6);
      entries = all.filter((e) => e.zeit.slice(0, 10) >= from && e.zeit.slice(0, 10) <= to);
      days = ui.weekOffset === 0 ? diffDays(from, t) + 1 : 7;
      buckets = [];
      for (let i = 0; i < 7; i++) {
        const d = addDays(from, i), es = entries.filter((e) => e.zeit.slice(0, 10) === d);
        const s = sums(es);
        buckets.push({ top: WD_SHORT[dow(d)], sub: parse(d).getDate() + ".", c: s.chris.p, l: s.lisa.p, today: d === t });
      }
    } else {
      entries = all;
      const first = all.length ? all.map((e) => e.zeit.slice(0, 10)).sort()[0] : t;
      days = diffDays(first, t) + 1;
      buckets = [];
      const m0 = mondayOf(t);
      for (let i = 7; i >= 0; i--) {
        const a = addDays(m0, -7 * i), b = addDays(a, 6);
        const s = sums(all.filter((e) => e.zeit.slice(0, 10) >= a && e.zeit.slice(0, 10) <= b));
        buckets.push({ top: "KW " + isoWeek(a), sub: parse(a).getDate() + "." + (parse(a).getMonth() + 1) + ".", c: s.chris.p, l: s.lisa.p, today: i === 0 });
      }
    }
    const s = sums(entries);
    const total = s.chris.p + s.lisa.p, totalN = s.chris.n + s.lisa.n;
    const pct = (v) => (total ? Math.round((v / total) * 100) : 0);
    const pc = pct(s.chris.p), plz = total ? 100 - pc : 0;

    let h = '<div class="statbar"><div class="seg" role="group" aria-label="Zeitraum">' +
      '<button data-act="smode" data-mode="woche" aria-pressed="' + (ui.statMode === "woche") + '">Woche</button>' +
      '<button data-act="smode" data-mode="gesamt" aria-pressed="' + (ui.statMode === "gesamt") + '">Gesamt</button></div>';
    if (ui.statMode === "woche") {
      h += '<div class="weeknav"><button data-act="wk" data-d="-1" aria-label="Vorherige Woche">' + ICON.chevL + "</button>" +
        "<span>KW " + isoWeek(from) + " · " + fmtRange(from, to) + "</span>" +
        '<button data-act="wk" data-d="1" aria-label="Nächste Woche"' + (ui.weekOffset >= 0 ? " disabled" : "") + ">" + ICON.chevR + "</button></div>";
    } else {
      h += '<div class="weeknav"><span>Alle Einträge</span></div>';
    }
    h += "</div>";

    if (S.log.some((e) => e.beispiel)) {
      h += '<div class="note"><span>Die Einträge vor heute sind <b>Beispiele</b>, damit du die Statistik gefüllt siehst.</span><button class="btn" data-act="clear-demo">Beispiele entfernen</button></div>';
    }

    const avg = days > 0 ? total / days : 0;
    h += '<div class="kpis">';
    for (const p of ["chris", "lisa"]) {
      h += '<div class="kpi ' + p + '"><span class="k"><span class="dot"></span>' + PEOPLE[p].name + "</span>" +
        '<span class="v">' + fmtNum(s[p].p) + "<small>Punkte</small></span>" +
        '<span class="s">' + s[p].n + (s[p].n === 1 ? " Aufgabe" : " Aufgaben") + " · " + (p === "chris" ? pc : plz) + " %</span></div>";
    }
    h += '<div class="kpi total"><span class="k">Zusammen</span><span class="v">' + fmtNum(total) + "<small>Punkte</small></span>" +
      '<span class="s">' + totalN + (totalN === 1 ? " Aufgabe" : " Aufgaben") + " · Ø " + fmtNum(Math.round(avg * 10) / 10) + " Punkte pro Tag</span></div></div>";

    // Kreisdiagramm
    const R = 54, C = 2 * Math.PI * R, gap = total && pc > 0 && plz > 0 ? 3 : 0;
    const lc = total ? (C * pc) / 100 : 0, ll = total ? (C * plz) / 100 : 0;
    let donut = '<svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Anteil an den Punkten: Christian ' + pc + ' Prozent, Lisa ' + plz + ' Prozent">' +
      '<circle class="track" cx="80" cy="80" r="' + R + '" stroke-width="20"/>';
    if (total) {
      if (lc > 0) donut += '<circle class="c" cx="80" cy="80" r="' + R + '" stroke-width="20" stroke-dasharray="' + Math.max(0, lc - gap) + " " + C + '" transform="rotate(-90 80 80)"/>';
      if (ll > 0) donut += '<circle class="l" cx="80" cy="80" r="' + R + '" stroke-width="20" stroke-dasharray="' + Math.max(0, ll - gap) + " " + C + '" stroke-dashoffset="' + (-lc) + '" transform="rotate(-90 80 80)"/>';
    }
    donut += '<text class="dv" x="80" y="84" text-anchor="middle">' + fmtNum(total) + '</text><text class="dl" x="80" y="104" text-anchor="middle">Punkte</text></svg>';

    h += '<div class="charts"><section class="panel"><div class="chead"><h2>Anteil an den Punkten</h2></div><div class="donutwrap">' + donut +
      '<div class="shares">' + ["chris", "lisa"].map((p) =>
        '<div class="share ' + p + '"><span class="n"><span class="dot"></span>' + PEOPLE[p].name + '</span><span class="p">' + (p === "chris" ? pc : plz) + " %<small>" + pl(s[p].p) + "</small></span></div>").join("") +
      "</div></div></section>";

    // Balkendiagramm
    const mx = niceMax(Math.max(0, ...buckets.map((b) => b.c + b.l)));
    h += '<section class="panel"><div class="chead"><h2>' + (ui.statMode === "woche" ? "Punkte pro Tag" : "Punkte pro Woche") + '</h2><div class="legend"><span class="chris"><i></i>Christian</span><span class="lisa"><i></i>Lisa</span></div></div>' +
      '<div class="bars"><div class="yaxis"><span style="bottom:100%">' + fmtNum(mx) + '</span><span style="bottom:50%">' + fmtNum(mx / 2) + '</span><span style="bottom:0">0</span></div>' +
      '<div class="plot"><div class="gl" style="top:0"></div><div class="gl" style="top:50%"></div><div class="bcols">' +
      buckets.map((b) => {
        const sum = b.c + b.l;
        return '<div class="bcol">' + (sum ? '<span class="bval">' + fmtNum(sum) + "</span>" : "") +
          '<div class="stack" style="height:' + (sum / mx) * 100 + '%">' +
          (b.l ? '<div class="sg l" style="flex:' + b.l + '"></div>' : "") + (b.c ? '<div class="sg c" style="flex:' + b.c + '"></div>' : "") + "</div></div>";
      }).join("") + "</div></div>" +
      '<div class="xl">' + buckets.map((b) => '<span class="' + (b.today ? "today" : "") + '"><b>' + b.top + "</b>" + b.sub + "</span>").join("") + "</div></div></section></div>";

    // Wer macht was wie oft
    const map = new Map();
    for (const e of entries) {
      if (!map.has(e.aufgabeId)) {
        const tk = S.tasks.find((x) => x.id === e.aufgabeId);
        map.set(e.aufgabeId, { titel: tk ? tk.titel : e.titel, c: 0, l: 0, p: 0 });
      }
      const m = map.get(e.aufgabeId);
      if (e.von === "chris") m.c++; else m.l++;
      m.p += e.punkte;
    }
    const rows = [...map.values()].sort((a, b) => b.c + b.l - (a.c + a.l) || a.titel.localeCompare(b.titel, "de"));
    h += '<section class="panel"><div class="chead"><h2>Wer hat was wie oft gemacht</h2></div><div class="bd">' +
      '<div class="bdrow h"><span>Aufgabe</span><span>Christian</span><span>Lisa</span><span>Verteilung</span></div>';
    h += rows.length ? rows.map((r) => {
      const n = r.c + r.l, wc = n ? (r.c / n) * 100 : 0;
      return '<div class="bdrow"><span class="c1">' + esc(r.titel) + "<small>" + pl(r.p) + ' insgesamt</small></span><span class="cn chris">' + r.c + '×</span><span class="cn lisa">' + r.l + "×</span>" +
        '<span class="split" role="img" aria-label="Christian ' + Math.round(wc) + ' Prozent, Lisa ' + Math.round(100 - wc) + ' Prozent">' + (r.c ? '<i class="c" style="width:' + wc + '%"></i>' : "") + (r.l ? '<i class="l" style="flex:1"></i>' : "") + "</span></div>";
    }).join("") : '<p class="empty">In diesem Zeitraum wurde noch nichts erledigt.</p>';
    h += "</div></section>";

    // Zuletzt erledigt
    const recent = entries.slice().sort((a, b) => (a.zeit < b.zeit ? 1 : -1)).slice(0, 8);
    if (recent.length) {
      h += '<section class="panel recent"><div class="chead"><h2>Zuletzt erledigt</h2></div>' + recent.map((e) =>
        '<div class="rrow ' + e.von + '"><span class="d">' + esc(fmtShort(e.zeit.slice(0, 10))) + " · " + e.zeit.slice(11, 16) + "</span><span>" + esc(e.titel) + '</span><span class="who">' + PEOPLE[e.von].name + '</span><span class="pts">+' + fmtNum(e.punkte) + "</span></div>").join("") + "</section>";
    }
    return h;
  }

  /* ---------- Rendern ---------- */
  function render() {
    FZ.theme();
    setSync();
    if (!SETUP.key) {
      $("#date").textContent = "";
      $("#view").innerHTML = '<section class="panel setup"><h2>Gerät einrichten</h2><p>Öffne am besten den Einrichtungs-Link, den Christian bekommen hat. Oder trage den Familien-Schlüssel hier ein.</p>' +
        '<div class="field"><label for="f-key">Familien-Schlüssel</label><input id="f-key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
        '<div class="actions"><button type="button" class="btn primary" data-act="key-save">Speichern</button></div></section>';
      return;
    }
    if (!loaded) {
      $("#view").innerHTML = syncErr
        ? '<section class="panel setup"><h2>Keine Verbindung zur Tabelle</h2><p>' + esc(syncErr) + '</p><div class="actions"><button type="button" class="btn" data-act="key-reset">Schlüssel neu eingeben</button><button type="button" class="btn primary" data-act="reload">Noch einmal versuchen</button></div></section>'
        : '<p class="loading">Lade Aufgaben aus der Google-Tabelle …</p>';
      return;
    }
    const d = new Date();
    $("#date").textContent = d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) + " · KW " + isoWeek(todayIso());
    for (const v of ["heute", "aufgaben", "statistik"]) $("#tab-" + v).setAttribute("aria-selected", String(ui.view === v));
    $("#view").innerHTML = '<div style="display:grid;gap:20px">' + (ui.view === "heute" ? renderHeute() : ui.view === "aufgaben" ? renderAufgaben() : renderStats()) + "</div>";
  }

  /* ---------- Toast ---------- */
  let toastTimer = null, toastActions = [];
  function toast(msg, actions) {
    const el = $("#toast");
    toastActions = actions || [];
    el.innerHTML = "<span>" + esc(msg) + "</span>" + toastActions.map((a, i) => '<button data-ti="' + i + '">' + esc(a.label) + "</button>").join("");
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 7000);
  }
  $("#toast").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-ti]"); if (!b) return;
    const a = toastActions[Number(b.dataset.ti)]; $("#toast").hidden = true; if (a) a.fn();
  });

  /* ---------- Erledigen, Verschieben, Aussetzen ---------- */
  function complete(id, von) {
    const task = S.tasks.find((x) => x.id === real(id)); if (!task) return;
    const prev = JSON.parse(JSON.stringify(task));
    const now = new Date();
    const entry = { id: uid(), aufgabeId: task.id, titel: task.titel, von, zeit: iso(now) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes()), punkte: Number(task.punkte) || 0, art: "erledigt" };
    const tmp = entry.id;
    S.log.push(entry);
    const ask = task.typ === "einmalig";
    if (ask) task.aktiv = false;
    else if (!task.mehrfach) task.naechste = computeNext(task, todayIso());
    const taskChanged = ask || !task.mehrfach;
    send(() => [opEntry(entry)].concat(taskChanged ? [opTask(task)] : []), (j) => adoptId(tmp, j.ergebnisse[0].id));
    save(); closeSheet(); render();
    doneToast(task, entry, prev);
    if (ask) openRepeat(task);
  }
  function doneToast(task, entry, prev) {
    toast("„" + task.titel + "“ erledigt · +" + fmtNum(entry.punkte) + " für " + PEOPLE[entry.von].name, [
      { label: "Doch " + PEOPLE[other(entry.von)].name, fn: () => {
        entry.von = other(entry.von);
        send(() => [{ art: "setzen", reiter: "Erledigt", wo: { ID: real(entry.id) }, werte: { "Erledigt von": entry.von } }]);
        save(); render(); doneToast(task, entry, prev);
      } },
      { label: "Rückgängig", fn: () => {
        Object.assign(task, prev, { id: task.id });
        S.log = S.log.filter((e) => e !== entry);
        send(() => [opDelEntry(entry), opTask(task)]);
        save(); closeSheet(); render(); toast("Rückgängig gemacht");
      } }
    ]);
  }
  function postpone(id) {
    const task = S.tasks.find((x) => x.id === real(id)); if (!task) return;
    const prev = task.naechste;
    task.naechste = addDays(todayIso(), 1);
    send(() => [opTask(task)]);
    save(); closeSheet(); render();
    toast("„" + task.titel + "“ auf morgen verschoben", [{ label: "Rückgängig", fn: () => { task.naechste = prev; send(() => [opTask(task)]); save(); render(); } }]);
  }
  function skip(id) {
    const task = S.tasks.find((x) => x.id === real(id)); if (!task) return;
    const prev = task.naechste;
    const entry = { id: uid(), aufgabeId: task.id, titel: task.titel, von: task.zustaendig === "offen" ? "chris" : task.zustaendig, zeit: todayIso() + "T00:00", punkte: 0, art: "ausgesetzt" };
    const tmp = entry.id;
    S.log.push(entry);
    task.naechste = computeNext(task, todayIso());
    send(() => [opEntry(entry), opTask(task)], (j) => adoptId(tmp, j.ergebnisse[0].id));
    save(); closeSheet(); render();
    toast("Diesmal ausgesetzt, ohne Punkte. Nächstes Mal: " + relDay(task.naechste), [{ label: "Rückgängig", fn: () => {
      task.naechste = prev; S.log = S.log.filter((e) => e !== entry);
      send(() => [opDelEntry(entry), opTask(task)]);
      save(); render();
    } }]);
  }

  /* ---------- Sheets ---------- */
  let draft = null;
  function openSheet(html) { $("#sheet").innerHTML = html; $("#overlay").hidden = false; const f = $("#sheet").querySelector("input:not([type=checkbox]), button"); if (f && window.matchMedia("(hover: hover)").matches) f.focus(); }
  function closeSheet() { $("#overlay").hidden = true; $("#sheet").innerHTML = ""; draft = null; }

  function openPicker(task) {
    openSheet('<h2>Wer hat das gemacht?</h2><p class="sub">' + esc(task.titel) + " · " + pl(task.punkte) + "</p>" +
      '<div class="pick">' + ["chris", "lisa"].map((p) => '<button class="' + p + '" data-act="pickdone" data-id="' + task.id + '" data-von="' + p + '">' + PEOPLE[p].name + "<small>bekommt " + pl(task.punkte) + "</small></button>").join("") + "</div>" +
      '<button class="btn ghost cancel" data-act="close">Abbrechen</button>');
  }
  function openMenu(task) {
    let b = "";
    if (!task.mehrfach) b += '<button class="btn" data-act="postpone" data-id="' + task.id + '">Auf morgen verschieben</button>';
    if (task.typ === "wiederkehrend" && !task.mehrfach) b += '<button class="btn" data-act="skip" data-id="' + task.id + '">Diesmal aussetzen (ohne Punkte)</button>';
    b += '<button class="btn" data-act="edit" data-id="' + task.id + '">Bearbeiten</button>';
    openSheet("<h2>" + esc(task.titel) + '</h2><p class="sub">' + esc(rhythmLabel(task)) + " · " + pl(task.punkte) + '</p><div class="menu">' + b + '</div><button class="btn ghost cancel" data-act="close">Abbrechen</button>');
  }

  function rhythmFields(withOnce) {
    const arts = (withOnce ? [["einmalig", "Einmalig"]] : []).concat([["taeglich", "Täglich"], ["wochentage", "An Wochentagen"], ["monatlich", "Monatlich"], ["intervall", "Alle X Tage"]]);
    return '<div class="field"><span class="lbl">Wie oft?</span><div class="chips" data-group="art">' +
      arts.map(([v, l]) => '<button type="button" data-act="pick" data-group="art" data-val="' + v + '">' + l + "</button>").join("") + "</div>" +
      '<div class="chips days" id="w-tage">' + WEEK_ORDER.map((d) => '<button type="button" data-act="day" data-day="' + d + '" aria-label="' + WD_LONG[d] + '">' + WD_SHORT[d] + "</button>").join("") + "</div>" +
      '<div class="inline" id="w-monat"><label for="f-tag">am</label><input id="f-tag" type="number" inputmode="numeric" min="1" max="31"><span>. des Monats</span></div>' +
      '<div class="inline" id="w-intervall"><label for="f-n">alle</label><input id="f-n" type="number" inputmode="numeric" min="1" max="365"><span>Tage nach der Erledigung</span></div>' +
      '<p class="hint" id="h-woche">Ein Tag gewählt heißt: einmal pro Woche.</p></div>';
  }
  function syncDraft() {
    const sh = $("#sheet");
    sh.querySelectorAll("[data-act=pick]").forEach((b) => b.setAttribute("aria-pressed", String(draft[b.dataset.group] === b.dataset.val)));
    sh.querySelectorAll("[data-act=day]").forEach((b) => b.setAttribute("aria-pressed", String(draft.tage.has(Number(b.dataset.day)))));
    const show = (id, on) => { const el = sh.querySelector("#" + id); if (el) el.hidden = !on; };
    show("w-tage", draft.art === "wochentage");
    show("h-woche", draft.art === "wochentage");
    show("w-monat", draft.art === "monatlich");
    show("w-intervall", draft.art === "intervall");
    show("w-mehrfach", draft.wer === "offen" && draft.art === "taeglich");
    show("h-offen", draft.wer === "offen");
    const ld = sh.querySelector("#l-datum"); if (ld) ld.textContent = draft.art === "einmalig" ? "Fällig am" : "Erstes Mal";
  }
  function readRhythm(err) {
    const a = draft.art;
    if (a === "einmalig") return null;
    if (a === "taeglich") return { art: a };
    if (a === "wochentage") { if (!draft.tage.size) { err("Bitte mindestens einen Wochentag wählen."); return false; } return { art: a, tage: [...draft.tage].sort() }; }
    if (a === "monatlich") { const n = parseInt($("#f-tag").value, 10); if (!(n >= 1 && n <= 31)) { err("Bitte einen Tag zwischen 1 und 31 eintragen."); return false; } return { art: a, tag: n }; }
    if (a === "intervall") { const n = parseInt($("#f-n").value, 10); if (!(n >= 1 && n <= 365)) { err("Bitte eine Zahl zwischen 1 und 365 Tagen eintragen."); return false; } return { art: a, n }; }
    return null;
  }

  function openForm(task) {
    const t = todayIso(), isNew = !task, r = task && task.rhythmus;
    draft = { mode: "form", id: task ? task.id : null, wer: task ? task.zustaendig : "chris", art: task ? (task.typ === "einmalig" ? "einmalig" : r.art) : "einmalig", tage: new Set(r && r.tage ? r.tage : [dow(t)]) };
    const pick = (v, l) => '<button type="button" class="' + v + '" data-act="pick" data-group="wer" data-val="' + v + '">' + l + "</button>";
    let h = "<h2>" + (isNew ? "Neue Aufgabe" : "Aufgabe bearbeiten") + "</h2>" +
      '<div class="field"><label for="f-titel">Was ist zu tun?</label><input id="f-titel" type="text" autocomplete="off" maxlength="60" placeholder="z. B. Fenster putzen" value="' + esc(task ? task.titel : "") + '"></div>' +
      '<div class="field"><span class="lbl">Wer?</span><div class="chips who">' + pick("chris", "Christian") + pick("lisa", "Lisa") + pick("offen", "Wer es macht") + "</div>" +
      '<p class="hint" id="h-offen">Wer die Aufgabe erledigt, trägt sich ein und bekommt die Punkte.</p></div>' +
      '<div class="field"><label for="f-punkte">Punkte</label><div class="stepper"><button type="button" data-act="step" data-d="-1" aria-label="Weniger Punkte">−</button>' +
      '<input id="f-punkte" type="number" inputmode="numeric" min="0" max="99" value="' + (task ? task.punkte : 2) + '"><button type="button" data-act="step" data-d="1" aria-label="Mehr Punkte">+</button></div>' +
      '<p class="hint">Richtwert: etwa 1 Punkt pro 10 Minuten Aufwand.' + (isNew ? "" : " Neue Punkte gelten ab jetzt, die Statistik behält die alten Werte.") + "</p></div>" +
      rhythmFields(true) +
      '<div class="field"><label for="f-datum" id="l-datum">Fällig am</label><input id="f-datum" type="date" value="' + (task ? (task.naechste < t ? t : task.naechste) : t) + '"></div>' +
      '<label class="checkline" id="w-mehrfach"><input type="checkbox" id="f-mehrfach"' + (task && task.mehrfach ? " checked" : "") + "> Mehrmals am Tag möglich (wie der Geschirrspüler)</label>" +
      '<p class="err" id="f-err" hidden></p>' +
      '<div class="actions">' + (isNew ? "" : '<button type="button" class="btn ghost left" data-act="del-ask">Löschen</button>') +
      '<button type="button" class="btn" data-act="close">Abbrechen</button><button type="button" class="btn primary" data-act="save">Speichern</button></div>' +
      (isNew ? "" : '<div class="confirm" id="del-box" hidden><p>„' + esc(task.titel) + "“ wirklich löschen? Bisherige Punkte bleiben in der Statistik.</p>" +
        '<div class="actions"><button type="button" class="btn" data-act="del-no">Behalten</button><button type="button" class="btn primary" data-act="del-yes">Löschen</button></div></div>');
    openSheet(h);
    $("#f-tag").value = r && r.tag ? r.tag : parse(t).getDate();
    $("#f-n").value = r && r.n ? r.n : 14;
    syncDraft();
  }
  function saveForm() {
    const errEl = $("#f-err");
    const err = (m) => { errEl.textContent = m; errEl.hidden = false; };
    const titel = $("#f-titel").value.trim();
    if (!titel) return err("Bitte einen Titel eintragen.");
    const punkte = parseInt($("#f-punkte").value, 10);
    if (!(punkte >= 0 && punkte <= 99)) return err("Bitte Punkte zwischen 0 und 99 eintragen.");
    const r = readRhythm(err); if (r === false) return;
    const datum = $("#f-datum").value || todayIso();
    const mehrfach = draft.wer === "offen" && draft.art === "taeglich" && $("#f-mehrfach").checked;
    const data = { titel, zustaendig: draft.wer, typ: r ? "wiederkehrend" : "einmalig", rhythmus: r, punkte, aktiv: true, mehrfach, naechste: firstDue(r, datum) };
    if (draft.id) {
      const task = S.tasks.find((x) => x.id === real(draft.id)); Object.assign(task, data);
      send(() => [opTask(task)]);
      toast("„" + titel + "“ gespeichert");
    } else {
      const nt = Object.assign({ id: uid() }, data), tmp = nt.id;
      S.tasks.push(nt);
      send(() => [{ art: "anfuegen", reiter: "Haushalt", werte: rowOf(nt) }], (j) => adoptId(tmp, j.ergebnisse[0].id));
      toast("„" + titel + "“ angelegt · " + (data.naechste <= todayIso() ? "heute fällig" : "fällig " + relDay(data.naechste)));
    }
    save(); closeSheet(); render();
  }
  function openRepeat(task) {
    draft = { mode: "repeat", id: task.id, wer: task.zustaendig, art: "wochentage", tage: new Set([dow(todayIso())]) };
    openSheet("<h2>Soll „" + esc(task.titel) + "“ wiederkommen?</h2>" +
      '<p class="sub">Als Routine bringt die Aufgabe jedes Mal wieder ' + pl(task.punkte) + ".</p>" +
      rhythmFields(false) + '<p class="err" id="f-err" hidden></p>' +
      '<div class="actions"><button type="button" class="btn" data-act="close">Nein, war einmalig</button><button type="button" class="btn primary" data-act="repeat-save">Als Routine speichern</button></div>');
    $("#f-tag").value = parse(todayIso()).getDate();
    $("#f-n").value = 14;
    syncDraft();
  }
  function saveRepeat() {
    const errEl = $("#f-err");
    const err = (m) => { errEl.textContent = m; errEl.hidden = false; };
    const r = readRhythm(err); if (!r) return;
    const task = S.tasks.find((x) => x.id === real(draft.id)); if (!task) return closeSheet();
    const t = todayIso();
    task.typ = "wiederkehrend"; task.rhythmus = r; task.aktiv = true;
    task.naechste = r.art === "intervall" ? addDays(t, r.n) : firstDue(r, addDays(t, 1));
    send(() => [opTask(task)]);
    save(); closeSheet(); render();
    toast("„" + task.titel + "“ ist jetzt eine Routine · nächstes Mal " + relDay(task.naechste));
  }

  /* ---------- Ereignisse ---------- */
  document.addEventListener("click", (ev) => {
    if (ev.target === $("#overlay")) return closeSheet();
    const el = ev.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const task = id ? S.tasks.find((x) => x.id === real(id)) : null;
    switch (act) {
      case "view": go(el.dataset.view); break;
      case "reload": syncErr = ""; setSync(); refresh(true); break;
      case "key-save": { const v = ($("#f-key").value || "").trim(); if (!v) break; SETUP.key = v; try { localStorage.setItem("fz.key", v); } catch (e) { /* ignorieren */ } render(); refresh(true); break; }
      case "key-reset": SETUP.key = ""; try { localStorage.removeItem("fz.key"); } catch (e) { /* ignorieren */ } render(); break;
      case "new": openForm(null); break;
      case "check": if (!task) break; if (task.zustaendig === "offen") openPicker(task); else complete(id, task.zustaendig); break;
      case "pickdone": complete(id, el.dataset.von); break;
      case "menu": if (task) openMenu(task); break;
      case "postpone": postpone(id); break;
      case "skip": skip(id); break;
      case "edit": if (task) openForm(task); break;
      case "close": closeSheet(); break;
      case "pick": draft[el.dataset.group] = el.dataset.val; syncDraft(); break;
      case "day": { const d = Number(el.dataset.day); if (draft.tage.has(d)) draft.tage.delete(d); else draft.tage.add(d); syncDraft(); break; }
      case "step": { const inp = $("#f-punkte"); const v = (parseInt(inp.value, 10) || 0) + Number(el.dataset.d); inp.value = Math.min(99, Math.max(0, v)); break; }
      case "save": saveForm(); break;
      case "repeat-save": saveRepeat(); break;
      case "del-ask": $("#del-box").hidden = false; break;
      case "del-no": $("#del-box").hidden = true; break;
      case "del-yes": { const did = real(draft.id); const t = S.tasks.find((x) => x.id === did); S.tasks = S.tasks.filter((x) => x.id !== did); send(() => [{ art: "loeschen", reiter: "Haushalt", wo: { ID: real(did) } }]); save(); closeSheet(); render(); if (t) toast("„" + t.titel + "“ gelöscht"); break; }
      case "smode": ui.statMode = el.dataset.mode; ui.weekOffset = 0; render(); break;
      case "wk": ui.weekOffset = Math.min(0, ui.weekOffset + Number(el.dataset.d)); render(); break;
      case "clear-demo": S.log = S.log.filter((e) => !e.beispiel); save(); render(); toast("Beispiele entfernt"); break;
    }
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("#overlay").hidden) closeSheet(); });

  const VIEWS = ["heute", "aufgaben", "statistik"];
  function go(v) {
    ui.view = v; render();

  }
  function fromHash() { const h = (location.hash || "").slice(1); if (VIEWS.includes(h)) { ui.view = h; render(); } }
  window.addEventListener("hashchange", fromHash);

  // Tageswechsel erkennen
  let lastDay = todayIso();
  setInterval(() => { FZ.theme(); if (todayIso() !== lastDay) { lastDay = todayIso(); render(); } }, 60000);

  FZ.nav("haushalt");
  FZ.schutz("Haushalt");
  FZ.start({ auto: false });
  render();
  refresh(true).then(() => { if (!loaded) render(); });
  let lastPoll = Date.now();
  setInterval(() => { if (Date.now() - lastPoll >= reloadMin * 60000) { lastPoll = Date.now(); refresh(false); } }, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(false); });
})();
</script>
</body>
</html>
